<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Suivi de séries personnel, hors ligne, données locales.">
<title>Antenne — suivi de séries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317131f'/%3E%3Cpath d='M16 20V11M16 11l-6-4M16 11l6-4' stroke='%23ff7a45' stroke-width='2.4' stroke-linecap='round'/%3E%3Crect x='10' y='20' width='12' height='4' rx='1.6' fill='%237ee0b8'/%3E%3C/svg%3E">
<style>
:root{
  /* Thème sombre — l'encre violette, référence de l'identité */
  --encre:#17131f; --carte:#211b2c; --carte2:#2b2338; --trait:#3a3049;
  --papier:#f0eae0; --gris:#9b93a8;
  --signal:#ff7a45; --signalF:rgba(255,122,69,.14); --signalB:rgba(255,122,69,.42); --surSignal:#2a1206;
  --vu:#7ee0b8;     --vuF:rgba(126,224,184,.12);    --vuB:rgba(126,224,184,.35);    --surVu:#12352a;
  --rouge:#ff5f6d;  --rougeB:rgba(255,95,109,.35);
  --voile:rgba(23,19,31,.92);
  --grain:#fff; --grainO:.035;
  --lisere:rgba(240,234,224,.08);
  --bAir:#4a3f5e; --bFut:#2e2740; --bRev:#3f6b5c;
  --r:12px;
  --tab:calc(60px + env(safe-area-inset-bottom));
}
html[data-theme="clair"]{
  /* Thème clair — la page de magazine, même encre, même orange d'antenne */
  --encre:#f4f1f7; --carte:#ffffff; --carte2:#eee9f4; --trait:#dcd5e6;
  --papier:#221b2e; --gris:#6b6379;
  --signal:#c2410c; --signalF:rgba(194,65,12,.09); --signalB:rgba(194,65,12,.32); --surSignal:#fff;
  --vu:#0f7a5a;     --vuF:rgba(15,122,90,.09);     --vuB:rgba(15,122,90,.32);     --surVu:#fff;
  --rouge:#c92a4a;  --rougeB:rgba(201,42,74,.32);
  --voile:rgba(244,241,247,.93);
  --grain:#000; --grainO:.02;
  --lisere:rgba(34,27,46,.1);
  --bAir:#b7abcb; --bFut:#e5dfee; --bRev:#8fc9b4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--encre);color:var(--papier);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{ /* grain de diffusion très léger */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grainO);
  background-image:repeating-linear-gradient(0deg,var(--grain) 0 1px,transparent 1px 3px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--signal)}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ------------ ossature ------------- */
.wrap{max-width:680px;margin:0 auto;padding:0 14px calc(var(--tab) + 24px);position:relative;z-index:1}
header.top{
  position:sticky;top:0;z-index:30;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--trait);
  padding-top:env(safe-area-inset-top);
}
.top-in{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.mark{display:flex;align-items:center;gap:8px;font-family:Archivo;font-weight:700;
  font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.mark svg{display:block}
.top-sp{flex:1}
.ver{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;color:var(--gris);
  border:1px solid var(--trait);background:var(--carte);border-radius:6px;padding:2px 6px;align-self:center}
.ver.neuf{color:var(--signal);border-color:var(--signalB);background:var(--signalF)}
.cl{border-top:1px solid var(--trait);padding:11px 0}
.cl:first-of-type{border-top:0;padding-top:2px}
.cl-h{display:flex;align-items:baseline;gap:9px}
.cl-v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600}
.cl-d{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--gris);letter-spacing:.08em}
.cl-t{font-size:12.5px;color:var(--gris);margin-left:auto}
.cl ul{margin:7px 0 0;padding-left:17px}
.cl li{font-size:13px;line-height:1.55;margin-bottom:3px}
.cl li::marker{color:var(--signal)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--carte);border:1px solid var(--trait);color:var(--papier)}
.iconbtn:active{background:var(--carte2)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gris);display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--trait)}
.eyebrow b{color:var(--signal);font-weight:600}

/* ------------ barre d'onglets ------------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--voile);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom);
}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gris);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px}
.tab.on{color:var(--papier);border-top-color:var(--signal)}
.tab.on svg{color:var(--signal)}
.tab .badge{position:absolute;transform:translate(14px,-6px);background:var(--signal);color:var(--surSignal);
  border-radius:9px;padding:0 5px;font-size:9px;font-weight:600;line-height:14px}
.tab-wrap{position:relative;display:flex}

/* ------------ cartes ------------- */
.card{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;padding:11px;align-items:flex-start;width:100%;text-align:left}
.poster{width:58px;height:84px;border-radius:7px;background:var(--carte2) center/cover no-repeat;
  flex:0 0 58px;position:relative;overflow:hidden}
.poster.lg{width:104px;height:150px;flex:0 0 104px}
.poster::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--lisere);border-radius:7px}
.ph{display:grid;place-items:center;color:var(--trait);font-family:Archivo;font-size:22px;font-weight:700;height:100%}
.info{min-width:0;flex:1}
.title{font-family:Archivo;font-weight:600;font-size:15.5px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--gris);font-size:12.5px;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  background:var(--carte2);border:1px solid var(--trait);color:var(--papier);
  padding:1px 6px;border-radius:5px;display:inline-block}
.code.next{background:var(--signalF);border-color:var(--signalB);color:var(--signal)}
.code.vu{background:var(--vuF);border-color:var(--vuB);color:var(--vu)}
.code.pass{background:var(--signalF);border-color:var(--signalB);color:var(--signal)}
/* État de diffusion : le point plein dit « ça continue », le point creux
   « c'est fini ». Volontairement sobre, pour ne pas concurrencer le bouton
   d'action ni la couleur du déjà-vu. */
.etat{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.02em;padding:1px 7px;border-radius:5px;border:1px solid var(--trait);
  background:var(--carte2);color:var(--gris);white-space:nowrap}
.etat::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:5px;vertical-align:1px;border:1px solid var(--gris);background:transparent}
.etat.en{color:var(--papier)}
.etat.en::before{background:var(--vu);border-color:var(--vu)}
.etat.att{color:var(--papier)}
.etat.att::before{background:var(--signal);border-color:var(--signal)}
.xn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--vu);
  background:var(--vuF);border:1px solid var(--vuB);border-radius:5px;
  padding:0 5px;flex:0 0 auto}
.plus1{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:grid;place-items:center;
  color:var(--vu);border:1px solid var(--vuB);font-family:"IBM Plex Mono",monospace;
  font-size:11px;font-weight:600}

/* ------------ SIGNATURE : la grille de diffusion ------------- */
.strip{display:flex;gap:1.5px;height:7px;margin-top:9px;border-radius:2px;overflow:hidden}
.strip i{flex:1 1 0;min-width:1.5px;background:var(--trait);border-radius:1px}
.strip i.a{background:var(--bAir)}             /* diffusé, pas vu */
.strip i.w{background:var(--vu)}               /* vu */
.strip i.p{background:linear-gradient(180deg,var(--vu) 0 50%,var(--bAir) 50% 100%)} /* partiel */
.strip i.r{background:var(--bRev)}             /* vu lors d'un passage précédent */
.strip i.f{background:var(--bFut)}             /* à venir */
.stripmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 9px;margin-top:6px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--gris);letter-spacing:.03em}

/* ------------ boutons ------------- */
.check{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--trait);
  display:grid;place-items:center;color:var(--gris);align-self:center;background:var(--carte2)}
.check.on{background:var(--vu);border-color:var(--vu);color:var(--surVu)}
.check:active{transform:scale(.92)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;
  border-radius:10px;background:var(--carte2);border:1px solid var(--trait);
  font-weight:600;font-size:14px}
.btn:active{background:var(--trait)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--surSignal)}
.btn.dgr{color:var(--rouge);border-color:var(--rougeB)}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;background:var(--carte);
  border:1px solid var(--trait);color:var(--gris);font-size:12.5px;font-weight:500}
.chip.on{background:var(--papier);border-color:var(--papier);color:var(--encre);font-weight:600}
.stack{display:flex;flex-direction:column;gap:9px}
.serie{display:flex}
.ops{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:9px 9px 9px 0}
.op{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  border:1px solid var(--trait);background:var(--carte2);color:var(--gris)}
.op:active{transform:scale(.92)}
.op.on{color:var(--signal);border-color:var(--signalB);background:var(--signalF)}
.op.vu{background:var(--vu);border-color:var(--vu);color:var(--surVu)}
.ops{gap:6px;align-items:stretch}
.opsrow{display:flex;gap:6px;justify-content:flex-end}
/* Bouton « épisode suivant » : orange d'action, jamais vert — le vert est
   réservé à ce qui est déjà vu, et prêtait à confusion ici. */
.opnext{display:flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 8px;
  border-radius:9px;border:1px solid var(--signalB);background:var(--signalF);color:var(--signal);
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.opnext:active{background:var(--signal);border-color:var(--signal);color:var(--surSignal);transform:scale(.96)}
.op.sup:active{color:var(--rouge);border-color:var(--rougeB)}
.card.arch{opacity:.5}
.card.arch .poster{filter:grayscale(1)}
.card.arch .strip{filter:grayscale(.8)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ------------ recherche ------------- */
.search{display:flex;align-items:center;gap:9px;background:var(--carte);border:1px solid var(--trait);
  border-radius:11px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:none;padding:12px 0;font-size:16px}
.search input::placeholder{color:var(--gris)}

/* ------------ fiche série ------------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--encre);overflow-y:auto;
  overscroll-behavior:contain}
.sheet.neuve{animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.hero{position:relative;padding:calc(env(safe-area-inset-top) + 14px) 14px 16px;
  background:linear-gradient(180deg,var(--carte) 0%,var(--encre) 100%);
  border-bottom:1px solid var(--trait)}
.hero .row{padding:0}
.sheetnav{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--trait)}
.seg{display:flex;background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:12px;font-weight:600;color:var(--gris)}
.seg button.on{background:var(--carte2);color:var(--papier);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.season{border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--carte)}
.season>summary{list-style:none;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.season>summary::-webkit-details-marker{display:none}
.season[open]>summary{border-bottom:1px solid var(--trait)}
.season h3{font-size:14px;flex:1}
.ep{display:flex;align-items:center;gap:10px;padding:9px 11px;border-top:1px solid var(--trait)}
.ep:first-child{border-top:0}
.ep .info{font-size:13.5px}
.ep .t{font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epinfo{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit}
.epinfo:active{opacity:.6}
.epres{padding:0 12px 12px 12px;font-size:13px;line-height:1.6;color:var(--gris);
  border-top:1px solid var(--trait);margin-top:-1px}
.epres b{color:var(--papier);font-weight:600}
.ep.done .t{color:var(--gris)}
.epchk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--trait);flex:0 0 34px;
  display:grid;place-items:center;color:var(--gris);background:var(--carte2)}
.epchk.on{background:var(--vu);border-color:var(--vu);color:var(--surVu)}
.upto{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:grid;place-items:center;
  color:var(--gris);border:1px solid var(--trait)}
.summary{color:var(--gris);font-size:13.5px;line-height:1.6}

/* ------------ stats ------------- */
.stat{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:13px}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gris);margin-top:5px}
.bar{display:flex;align-items:center;gap:9px;padding:7px 0}
.bar .lb{width:34%;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:8px;background:var(--carte2);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--signal);border-radius:4px}
.bar .vl{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--gris);min-width:48px;text-align:right}
.spark{display:flex;align-items:flex-end;gap:3px;height:74px;margin-top:6px}
.spark div{flex:1;background:var(--carte2);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.spark div.hot{background:var(--signal)}
.sparkx{display:flex;gap:3px;margin-top:5px}
.sparkx span{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--gris)}

/* ------------ divers ------------- */
.empty{text-align:center;padding:44px 18px;color:var(--gris)}
.empty h3{font-size:17px;color:var(--papier);margin-bottom:7px}
.empty p{margin:0 0 16px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 14px);transform:translateX(-50%) translateY(70px);
  background:var(--papier);color:var(--encre);padding:10px 16px;border-radius:10px;font-size:13.5px;
  font-weight:600;z-index:90;opacity:0;transition:.24s;max-width:88vw;text-align:center;pointer-events:none}
.toast.on{transform:translateX(-50%);opacity:1}
.note{font-size:12.5px;color:var(--gris);line-height:1.55}
.box{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:13px}
.box h3{font-size:14px;margin-bottom:4px}
.log{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--gris);
  max-height:190px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-top:9px}
.pgt{height:5px;background:var(--carte2);border-radius:3px;overflow:hidden;margin-top:9px}
.pgt i{display:block;height:100%;background:var(--signal);width:0;transition:width .2s}
textarea{width:100%;background:var(--carte2);border:1px solid var(--trait);border-radius:9px;
  padding:10px;color:var(--papier);font-size:14px;resize:vertical;outline:none}
.sw{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--trait)}
.sw:first-of-type{border-top:0}
.sw .info{font-size:13.5px}
.tg{width:46px;height:27px;border-radius:14px;background:var(--carte2);border:1px solid var(--trait);
  flex:0 0 46px;position:relative;transition:.16s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:var(--gris);transition:.16s}
.tg.on{background:var(--vuF);border-color:var(--vu)}
.tg.on::after{left:22px;background:var(--vu)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
@media(min-width:520px){.poster{width:70px;height:101px;flex:0 0 70px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 21V12M16 12 9 7M16 12l7-5" stroke="var(--signal)" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="9" y="21" width="14" height="5" rx="2" fill="var(--vu)"/>
      </svg>
      Antenne
    </div>
    <button class="ver" id="ver-chip" data-act="changelog" title="Voir les nouveautés"></button>
    <div class="top-sp"></div>
    <button class="iconbtn" data-act="go-search" aria-label="Rechercher une série">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs">
  <div class="tabs-in" id="tabs"></div>
</nav>

<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Antenne — suivi de séries personnel
   Données : TVmaze (libre, sans clé). Stockage : localStorage.
   ============================================================ */

const API = "https://api.tvmaze.com";
const LS  = "antenne.v1";

/* ---------- version de l'application ----------
   VERSION  : ce que tu lis dans l'entête et dans les sauvegardes.
   SCHEMA   : structure des données. À incrémenter seulement quand

/* ---------- thème ----------
   Le choix est doublé dans localStorage pour être appliqué dès la première
   ligne exécutée : la base IndexedDB s'ouvre en asynchrone, et sans ce doublon
   la page clignoterait en sombre avant de passer en clair.               */
const LSTHEME = "antenne.theme";
const THEMES = [["sombre", "Sombre"], ["clair", "Clair"], ["auto", "Système"]];
const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;

function appliquerTheme(t){
  const clair = t === "auto" ? !!(media && media.matches) : t === "clair";
  document.documentElement.setAttribute("data-theme", clair ? "clair" : "sombre");
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", clair ? "#f4f1f7" : "#17131f");
}
function litTheme(){ try{ return localStorage.getItem(LSTHEME); }catch(e){ return null; } }
function themeActuel(){ return litTheme() || "sombre"; }
appliquerTheme(themeActuel());
if(media && media.addEventListener)
  media.addEventListener("change", () => { if(themeActuel() === "auto") appliquerTheme("auto"); });

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const strip = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return (d.textContent || "").trim(); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); };
const MOIS = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const JOURS = ["dim","lun","mar","mer","jeu","ven","sam"];

function frDate(iso){
  if(!iso) return "date inconnue";
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
}
function relDate(iso){
  if(!iso) return "date inconnue";
  const a = new Date(iso + "T12:00:00"), b = new Date(todayISO() + "T12:00:00");
  const j = Math.round((a - b) / 86400000);
  if(j === 0) return "aujourd'hui";
  if(j === 1) return "demain";
  if(j === -1) return "hier";
  if(j < 0 && j > -7) return "il y a " + (-j) + " jours";
  if(j > 0 && j < 7)  return "dans " + j + " jours";
  return frDate(iso);
}
function dureeLongue(min){
  if(!min) return "0 h";
  const j = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  if(j) return h ? j + " j " + h + " h" : j + " j";
  if(h) return m ? h + " h " + p2(m) : h + " h";
  return m + " min";
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ---------- file d'attente réseau (respect du quota TVmaze) ---------- */
const net = (() => {
  const q = []; let busy = false, last = 0; const GAP = 520;
  async function pump(){
    if(busy || !q.length) return;
    busy = true;
    const job = q.shift();
    const w = GAP - (Date.now() - last);
    if(w > 0) await sleep(w);
    last = Date.now();
    try{
      const r = await fetch(job.url, { headers:{ Accept:"application/json" } });
      if(r.status === 429){ q.unshift(job); busy = false; await sleep(2600); return pump(); }
      if(r.status === 404){ job.res(null); }
      else if(!r.ok){ job.rej(new Error("HTTP " + r.status)); }
      else { job.res(await r.json()); }
    }catch(e){ job.rej(e); }
    busy = false; pump();
  }
  return { get: url => new Promise((res, rej) => { q.push({ url, res, rej }); pump(); }) };
})();

/* ============================================================
   STOCKAGE — IndexedDB
   L'objet DB reste la source de vérité en mémoire : tout le rendu
   travaille dessus de façon synchrone, comme avant. Seules la lecture
   initiale et les écritures passent par la base, en asynchrone.
   Les écritures sont granulaires : cocher un épisode écrit un seul
   enregistrement, pas la bibliothèque entière.
   ============================================================ */
const DEFAULTS = { version:SCHEMA, shows:{}, watched:{}, films:{}, settings:{ specials:false, hideEnded:false },
                   meta:{ created:Date.now(), vue:null } };
DEFAULTS.settings.theme = "sombre";
DEFAULTS.settings.tri = "recent";   // à défaut de choix : tri par date de diffusion
DEFAULTS.settings.filtre = "all";
DEFAULTS.settings.langue = "fr";
let DB = JSON.parse(JSON.stringify(DEFAULTS));
let pret = false;

const IDB = (() => {
  const NOM = "antenne", V = 2;
  let db = null;
  const prom = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const stores = ["shows", "watched", "kv", "films"];
  return {
    ouvrir(){
      return new Promise((res, rej) => {
        if(!window.indexedDB) return rej(new Error("IndexedDB indisponible"));
        const r = indexedDB.open(NOM, V);
        r.onupgradeneeded = () => {
          const d = r.result;
          if(!d.objectStoreNames.contains("shows"))   d.createObjectStore("shows", { keyPath:"id" });
          if(!d.objectStoreNames.contains("watched")) d.createObjectStore("watched");
          if(!d.objectStoreNames.contains("kv"))      d.createObjectStore("kv");
          if(!d.objectStoreNames.contains("films"))   d.createObjectStore("films", { keyPath:"id" });
        };
        r.onsuccess = () => { db = r.result; res(db); };
        r.onerror = () => rej(r.error || new Error("ouverture refusée"));
        r.onblocked = () => rej(new Error("base verrouillée par un autre onglet"));
      });
    },
    async tout(){
      const t = db.transaction(stores, "readonly");
      const [shows, wk, wv, kk, kvv, films] = await Promise.all([
        prom(t.objectStore("shows").getAll()),
        prom(t.objectStore("watched").getAllKeys()),
        prom(t.objectStore("watched").getAll()),
        prom(t.objectStore("kv").getAllKeys()),
        prom(t.objectStore("kv").getAll()),
        prom(t.objectStore("films").getAll())
      ]);
      const watched = {}; wk.forEach((k, i) => { watched[k] = wv[i]; });
      const kv = {};      kk.forEach((k, i) => { kv[k] = kvv[i]; });
      return { shows, watched, kv, films };
    },
    ecrire(lots){
      return new Promise((res, rej) => {
        const t = db.transaction(stores, "readwrite");
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
        t.onabort  = () => rej(t.error || new Error("écriture annulée"));
        const S = t.objectStore("shows"), W = t.objectStore("watched"), K = t.objectStore("kv"), F = t.objectStore("films");
        (lots.shows || []).forEach(sh => S.put(sh));
        (lots.suppr || []).forEach(id => S.delete(Number(id)));
        (lots.films || []).forEach(fi => F.put(fi));
        (lots.supprFilms || []).forEach(id => F.delete(String(id)));
        Object.keys(lots.vues || {}).forEach(k => { const v = lots.vues[k]; if(v && v.length) W.put(v, k); else W.delete(k); });
        Object.keys(lots.kv || {}).forEach(k => K.put(lots.kv[k], k));
      });
    },
    vider(){
      return new Promise((res, rej) => {
        const t = db.transaction(stores, "readwrite");
        t.oncomplete = () => res(); t.onerror = () => rej(t.error);
        stores.forEach(x => t.objectStore(x).clear());
      });
    }
  };
})();

/* ---------- file d'écriture ---------- */
const sale = { shows:new Set(), suppr:new Set(), vues:new Set(), films:new Set(), supprFilms:new Set(), kv:false };
let _fl;
function planifier(){ clearTimeout(_fl); _fl = setTimeout(ecouler, 150); }
async function ecouler(){
  if(!pret) return;
  if(!sale.shows.size && !sale.suppr.size && !sale.vues.size && !sale.films.size && !sale.supprFilms.size && !sale.kv) return;
  const lots = { shows:[], suppr:[...sale.suppr], vues:{}, films:[], supprFilms:[...sale.supprFilms], kv:{} };
  sale.shows.forEach(id => { const sh = DB.shows[id]; if(sh) lots.shows.push(sh); });
  sale.films.forEach(id => { const fi = DB.films[id]; if(fi) lots.films.push(fi); });
  sale.vues.forEach(k => { lots.vues[k] = DB.watched[k] || null; });
  if(sale.kv) lots.kv = { settings:DB.settings, meta:DB.meta, version:SCHEMA };
  sale.shows.clear(); sale.suppr.clear(); sale.vues.clear();
  sale.films.clear(); sale.supprFilms.clear(); sale.kv = false;
  try{ await IDB.ecrire(lots); }
  catch(e){ toast("Enregistrement impossible : " + (e && e.message || e)); }
}
function sauver(){ sale.kv = true; planifier(); }
function sauverShow(sh){ if(sh) sale.shows.add(String(sh.id)); sale.kv = true; planifier(); }
function sauverFilm(fi){ if(fi) sale.films.add(String(fi.id)); sale.kv = true; planifier(); }
function salirVues(k){ sale.vues.add(String(k)); planifier(); }
function toutSalir(){
  Object.keys(DB.shows).forEach(id => sale.shows.add(id));
  Object.keys(DB.films).forEach(id => sale.films.add(id));
  Object.keys(DB.watched).forEach(k => sale.vues.add(k));
  sale.kv = true; planifier();
}

/* ---------- lecture et reprise de l'ancien stockage ---------- */
function assembler(k){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  (k.shows || []).forEach(sh => { if(!sh.pass) sh.pass = 1; d.shows[sh.id] = sh; });
  (k.films || []).forEach(fi => { if(!Array.isArray(fi.vu)) fi.vu = fi.vu ? [fi.vu] : []; d.films[fi.id] = fi; });
  Object.keys(k.watched || {}).forEach(key => {
    const v = k.watched[key];
    const a = Array.isArray(v) ? v : (v ? [v] : []);
    if(a.length) d.watched[key] = a;
  });
  d.settings = { ...DEFAULTS.settings, ...(k.kv.settings || {}) };
  d.meta     = { ...DEFAULTS.meta,     ...(k.kv.meta     || {}) };
  return d;
}
async function reprendreLocalStorage(){
  const raw = localStorage.getItem(LS);
  if(!raw) return 0;
  const d = JSON.parse(raw);
  const shows = Object.values(d.shows || {}).map(sh => ({ ...sh, pass:sh.pass || 1 }));
  const vues = {};
  Object.keys(d.watched || {}).forEach(k => {
    const v = d.watched[k], a = Array.isArray(v) ? v : (v ? [v] : []);
    if(a.length) vues[k] = a;
  });
  await IDB.ecrire({ shows, vues, kv:{
    settings:d.settings || {}, version:SCHEMA,
    meta:{ ...(d.meta || {}), repris:new Date().toISOString() } } });
  return shows.length;
}

async function majQuota(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  try{
    state.quota = await navigator.storage.estimate();
    state.durable = navigator.storage.persisted ? await navigator.storage.persisted() : false;
    if(pret && state.tab === "reglages" && !state.detail && !state.cherche) render();
  }catch(e){}
}
function ko(o){
  if(o == null) return "?";
  if(o > 1048576) return (o / 1048576).toFixed(1) + " Mo";
  if(o > 1024) return Math.round(o / 1024) + " Ko";
  return o + " o";
}

/* ---------- modèle ---------- */
function normShow(s){
  return {
    id:s.id, name:s.name || "Sans titre",
    poster:s.image ? (s.image.medium || s.image.original) : null,
    premiered:s.premiered || null, ended:s.ended || null, status:s.status || "",
    network:(s.network && s.network.name) || (s.webChannel && s.webChannel.name) || "",
    runtime:s.averageRuntime || s.runtime || null,
    genres:s.genres || [], summary:strip(s.summary), lang:s.language || "",
    tvdb:(s.externals && s.externals.thetvdb) || null,
    imdb:(s.externals && s.externals.imdb) || null,
    url:s.url || null
  };
}
function normEps(list){
  return (list || []).map(e => ({
    i:e.id, s:e.season == null ? 0 : e.season, n:e.number,
    t:e.name || "", d:e.airdate || null, r:e.runtime || null,
    sp:(e.type && e.type !== "regular") || e.number == null ? 1 : 0
  })).sort((a, b) => a.s - b.s || (a.n ?? 999) - (b.n ?? 999) || String(a.d).localeCompare(String(b.d)));
}
async function fetchShow(id){
  const raw = await net.get(API + "/shows/" + id + "?embed=episodes");
  if(!raw) return null;
  const sh = normShow(raw);
  sh.eps = normEps(raw._embedded && raw._embedded.episodes);
  return sh;
}
function ajouterShow(sh, statut){
  const old = DB.shows[sh.id] || {};
  DB.shows[sh.id] = {
    ...sh,
    userStatus: statut || old.userStatus || "watching",
    pass: old.pass || 1,
    activite: old.activite || Date.now(),
    archive: old.archive || false,
    favorite: old.favorite || false,
    addedAt: old.addedAt || Date.now(),
    lastFetched: Date.now()
  };
  sauverShow(DB.shows[sh.id]);
}
function retirerShow(id){
  const sh = DB.shows[id];
  if(sh) (sh.eps || []).forEach(e => { delete DB.watched[e.i]; salirVues(e.i); });
  delete DB.shows[id];
  sale.suppr.add(String(id)); sale.shows.delete(String(id)); sauver();
}
const epsOf = sh => (sh.eps || []).filter(e => DB.settings.specials || !e.sp);
const diffuse = e => !!e.d && e.d <= todayISO();

/* Un épisode garde la liste datée de tous ses visionnages.
   Une série a un « passage » courant : au 2e visionnage, il faut 2 dates
   pour qu'un épisode compte comme vu dans ce passage. */
const vues   = e => { const v = DB.watched[e.i]; return Array.isArray(v) ? v : (v ? [v] : []); };
const nbVues = e => vues(e).length;
const passe  = sh => sh.pass || 1;
const vu     = (e, sh) => nbVues(e) >= passe(sh);
const dejaVu = e => nbVues(e) > 0;

function poser(ep, liste){
  if(liste && liste.length) DB.watched[ep.i] = liste;
  else delete DB.watched[ep.i];
  salirVues(ep.i);
}
function avancement(sh){
  const eps = epsOf(sh);
  const air = eps.filter(diffuse);
  const w = eps.filter(e => vu(e, sh));
  return { total:eps.length, aired:air.length, watched:w.length,
           pct: air.length ? Math.round(w.filter(diffuse).length / air.length * 100) : 0 };
}
function prochainAVoir(sh){ return epsOf(sh).find(e => diffuse(e) && !vu(e, sh)) || null; }
/* TVmaze ne distingue pas « annulée » de « terminée » : les deux sont Ended.
   On rend donc l'information telle qu'elle est publiée, sans l'inventer. */
const DIFFUSION = {
  "Running":            ["En production", "vu"],
  "To Be Determined":   ["Suite indéterminée", "next"],
  "In Development":     ["En développement", "next"],
  "Ended":              ["Terminée", ""]
};
const DIFFUSION_COURT = {
  "Running":          ["En cours", "en"],
  "To Be Determined": ["À confirmer", "att"],
  "In Development":   ["En dev", "att"],
  "Ended":            ["Terminée", ""]
};
function etatCourt(sh){
  const d = DIFFUSION_COURT[sh.status];
  if(!d) return sh.status ? '<span class="etat">' + esc(sh.status) + '</span>' : "";
  return '<span class="etat ' + d[1] + '">' + d[0] + '</span>';
}
function chipDiffusion(sh){
  const d = DIFFUSION[sh.status];
  if(!d) return sh.status ? '<span class="code">' + esc(sh.status) + '</span>' : "";
  return '<span class="code ' + d[1] + '">' + d[0] + '</span>';
}
function prochaineDiffusion(sh){ return epsOf(sh).find(e => e.d && e.d > todayISO()) || null; }
function tempsVu(sh){
  return epsOf(sh).reduce((t, e) => t + nbVues(e) * (e.r || sh.runtime || 42), 0);
}
/* Temps qu'il reste à regarder pour boucler le passage en cours,
   sur les seuls épisodes déjà diffusés. */
function tempsRestant(sh){
  return epsOf(sh).filter(e => diffuse(e) && !vu(e, sh))
                  .reduce((t, e) => t + (e.r || sh.runtime || 42), 0);
}
function aVenir(sh){ return epsOf(sh).filter(e => e.d && e.d > todayISO()).length; }
/* Nombre de fois où la série a été vue en entier : le plus petit nombre de
   visionnages parmi les épisodes déjà diffusés. 0 tant qu'il en reste un seul
   à voir. */
function tours(sh){
  const air = epsOf(sh).filter(diffuse);
  if(!air.length) return 0;
  return Math.min.apply(null, air.map(nbVues));
}
function episodesRevus(sh){ return epsOf(sh).filter(e => nbVues(e) > 1).length; }

/* Dernière fois où la série a bougé : un épisode coché, un ajout, un passage.
   Pour les séries antérieures à cette notion, on la reconstitue une fois à
   partir de la date de visionnage la plus récente, puis on la mémorise. */
function dernierVu(sh){
  let max = 0;
  (sh.eps || []).forEach(e => {
    const v = vues(e);
    if(!v.length) return;
    const t = Date.parse(v[v.length - 1]);
    if(t && t > max) max = t;
  });
  return max;
}
function activiteDe(sh){
  if(sh.activite) return sh.activite;
  sh.activite = dernierVu(sh) || sh.addedAt || 0;
  return sh.activite;
}
function toucher(sh){
  if(!sh) return;
  sh.activite = Date.now();
  // La série vient probablement de changer de rang. On la marque pour la
  // retrouver à l'écran en revenant sur la liste, quel que soit le tri :
  // remonter aveuglément en haut ferait perdre sa place aux tris qui, eux,
  // ne bougent pas (A → Z, Ajout).
  state.vise = sh.id;
  state.limite = PAGE;
}
/* Amène à l'écran la carte de la dernière série touchée. */
function viser(){
  if(!state.vise) return false;
  const id = state.vise; state.vise = null;
  const el = document.querySelector('[data-act="open"][data-id="' + id + '"], [data-act="open-f"][data-id="' + CSS.escape(String(id)) + '"]');
  if(!el) return false;
  const carte = el.closest(".card") || el;
  const y = carte.getBoundingClientRect().top + window.scrollY - 100;
  window.scrollTo(0, y < 140 ? 0 : y);
  return true;
}
function revuTexte(sh){
  const t = tours(sh), r = episodesRevus(sh);
  if(t >= 2) return { court:"↺" + t, long:"Vue " + t + " fois en entier" +
    (r ? ", dont " + r + " épisode" + (r > 1 ? "s" : "") + " revus" : "") };
  if(r) return { court:"↺" + r, long:r + " épisode" + (r > 1 ? "s" : "") + " revu" + (r > 1 ? "s" : "") };
  return null;
}
const norm = x => String(x == null ? "" : x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function marquer(ep, sh, on){
  const v = vues(ep).slice();
  if(on){ if(v.length < passe(sh)) v.push(new Date().toISOString()); }
  else  { if(v.length >= passe(sh)) v.pop(); }
  poser(ep, v); sauver();
}
function revoirEpisode(ep){
  const v = vues(ep).slice(); v.push(new Date().toISOString()); poser(ep, v); sauver();
}
function marquerJusqua(sh, ep){
  const eps = epsOf(sh);
  const idx = eps.findIndex(e => e.i === ep.i);
  eps.slice(0, idx + 1).filter(diffuse).forEach(e => marquer(e, sh, true));
  sauver();
}
function nouveauPassage(sh){ sh.pass = passe(sh) + 1; sauverShow(sh); }
function annulerPassage(sh){
  if(passe(sh) <= 1) return;
  epsOf(sh).forEach(e => { const v = vues(e).slice(); if(v.length >= passe(sh)) v.pop(); poser(e, v); });
  sh.pass = passe(sh) - 1; sauverShow(sh);
}
function autoStatut(sh){
  const a = avancement(sh);
  if(a.aired && a.pct === 100 && (sh.status === "Ended" || sh.status === "Canceled") && !prochaineDiffusion(sh))
    sh.userStatus = "completed";
}

/* Le rendu reconstruit le DOM. Sans précaution, le conteneur passe par une
   hauteur nulle pendant l'échange et le navigateur ramène la page en haut.
   On fige donc la hauteur le temps du remplacement, puis on rend sa position
   à la page et au panneau de la fiche, qui a son propre défilement.        */
function render(){
  const vueEl = $("#view");
  const anc = document.querySelector(".sheet");
  const posSheet = anc ? anc.scrollTop : 0;
  const posPage = window.scrollY;
  const hauteur = vueEl.offsetHeight;
  if(hauteur) vueEl.style.minHeight = hauteur + "px";

  dessiner();

  const neuf = document.querySelector(".sheet");
  if(neuf && posSheet) neuf.scrollTop = posSheet;
  if(window.scrollY !== posPage) window.scrollTo(0, posPage);
  requestAnimationFrame(() => { vueEl.style.minHeight = ""; });
}

function dessiner(){
  $("#tabs").innerHTML = TABS.map(t => {
    const n = t.id === "library" ? listeASuivre().length
            : t.id === "films"   ? Object.values(DB.films).filter(f => !f.archive && !nbVuesFilm(f)).length : 0;
    return '<button class="tab tab-wrap ' + (state.tab === t.id ? "on" : "") + '" data-act="tab" data-id="' + t.id + '">' +
      '<span style="position:relative;display:flex">' + svg(t.i, 20) +
      (n ? '<span class="badge">' + (n > 99 ? "99+" : n) + '</span>' : "") + '</span>' +

                        : state.detailF ? vueFicheFilm(DB.films[state.detailF]) : "";

/* ---------- bandes de diffusion (élément signature) ---------- */
function bande(sh){
  const eps = epsOf(sh);
  if(!eps.length) return "";
  const MAX = 92;
  // 3 = vu dans ce passage · 2 = vu avant, à revoir · 1 = diffusé jamais vu · 0 = à venir
  const etat = eps.map(e => vu(e, sh) ? 3 : (dejaVu(e) ? 2 : (diffuse(e) ? 1 : 0)));
  const cl = x => x === 3 ? "w" : x === 2 ? "r" : x === 1 ? "a" : "f";
  let cells;
  if(etat.length <= MAX) cells = etat.map(cl);
  else{
    const k = Math.ceil(etat.length / MAX); cells = [];
    for(let i = 0; i < etat.length; i += k){
      const c = etat.slice(i, i + k);
      const w = c.filter(x => x === 3).length;
      cells.push(w === c.length ? "w" : w ? "p" : cl(Math.max.apply(null, c)));
    }
  }
  return '<div class="strip" aria-hidden="true">' + cells.map(c => '<i class="' + c + '"></i>').join("") + '</div>';
}

/* ---------- carte série ---------- */
function affiche(sh, cls){
  const c = cls || "";
  return sh.poster
    ? '<div class="poster ' + c + '" style="background-image:url(' + esc(sh.poster) + ')"></div>'
    : '<div class="poster ' + c + '"><div class="ph">' + esc((sh.name || "?")[0].toUpperCase()) + '</div></div>';
}

function carteSerie(sh){
  const a = avancement(sh);
  const nx = prochainAVoir(sh), up = prochaineDiffusion(sh);
  const reste = tempsRestant(sh), futurs = aVenir(sh), rev = revuTexte(sh);
  const resteTxt = reste ? "reste " + dureeLongue(reste)
    : futurs ? futurs + " à venir"
    : a.total && a.watched === a.total ? "complète" : "à jour";
  const pp = etatCourt(sh) + " " + (passe(sh) > 1 ? '<span class="code pass">Passage ' + passe(sh) + '</span> ' : "");
  let ligne;
  if(nx) ligne = pp + esc(nx.t || "Épisode sans titre");
  else if(up) ligne = pp + 'retour ' + relDate(up.d);
  else if(a.total && a.watched === a.total) ligne = pp + 'tout vu';
  else ligne = pp + 'à jour';
  return '<div class="card serie' + (sh.archive ? " arch" : "") + '">' +
    '<button class="row" style="flex:1;min-width:0" data-act="open" data-id="' + sh.id + '">' +
    affiche(sh) +
    '<div class="info"><div class="title">' + esc(sh.name) + '</div>' +
    '<div class="sub">' + ligne + '</div>' + bande(sh) +
    '<div class="stripmeta"><span>' + a.watched + '/' + a.aired + ' vus</span>' +
      '<span style="color:' + (reste ? "var(--signal)" : "var(--gris)") + '">' + resteTxt + '</span>' +
      (rev ? '<span style="color:var(--vu)" title="' + esc(rev.long) + '">' + rev.court + '</span>' : "") +
      '<span>' + a.pct + ' %</span></div>' +
    '</div></button>' +
    '<div class="ops">' +
      (nx ? '<button class="opnext" data-act="tick-next" data-id="' + sh.id + '" ' +
        'title="Marquer S' + p2(nx.s) + 'E' + p2(nx.n || 0) + ' vu" aria-label="Marquer S' + p2(nx.s) + 'E' + p2(nx.n || 0) + ' vu">' +
        svg("check", 14) + '<span>S' + p2(nx.s) + 'E' + p2(nx.n || 0) + '</span></button>' : "") +
      '<div class="opsrow">' +
        '<button class="op' + (sh.archive ? " on" : "") + '" data-act="archiver" data-id="' + sh.id + '" ' +
          'title="' + (sh.archive ? "Sortir des archives" : "Archiver") + '" aria-label="' + (sh.archive ? "Sortir des archives" : "Archiver") + '">' +
          svg("archive", 17) + '</button>' +
        '<button class="op sup" data-act="supprimer" data-id="' + sh.id + '" title="Retirer de ma liste" aria-label="Retirer de ma liste">' +
          svg("poubelle", 17) + '</button>' +
      '</div>' +
    '</div></div>';
}

/* ---------- séries en attente (sert au compteur de l'onglet) ---------- */
function listeASuivre(){
  return Object.values(DB.shows)
    .filter(sh => !sh.archive && (sh.userStatus === "watching" || sh.userStatus === "planned"))
    .map(sh => ({ sh, ep: prochainAVoir(sh) }))
    .filter(x => x.ep)
    .sort((a, b) => String(b.ep.d).localeCompare(String(a.ep.d)));
}
/* ---------- vue : Ma liste ---------- */
const FILTRES = [
  { id:"all", l:"Toutes" }, { id:"watching", l:"En cours" }, { id:"rewatch", l:"Revisionnage" }, { id:"late", l:"En retard" },
  { id:"uptodate", l:"À jour" }, { id:"completed", l:"Terminées" },
  { id:"planned", l:"À voir" }, { id:"dropped", l:"Abandonnées" }, { id:"archived", l:"Archivées" }
];
function vueListe(){
  const tout = Object.values(DB.shows);
  if(!tout.length)
    return '<div class="empty" style="padding-top:64px"><h3>Liste vide</h3><p>Ajoute une première série pour démarrer.</p>' +
      '<button class="btn pri" data-act="go-search">Chercher une série</button></div>';

  /* --- filtrage --- */
  let l = tout;
  const f = state.filtre;
  // Les archives n'apparaissent que dans « Toutes », reléguées en bas, et dans leur propre filtre.
  if(f === "archived")      l = l.filter(sh => sh.archive);
  else if(f !== "all")      l = l.filter(sh => !sh.archive);
  if(f === "rewatch")       l = l.filter(sh => passe(sh) > 1);
  else if(f === "late")     l = l.filter(sh => sh.userStatus !== "dropped" && prochainAVoir(sh));
  else if(f === "uptodate") l = l.filter(sh => sh.userStatus !== "dropped" && !prochainAVoir(sh) && avancement(sh).watched > 0);
  else if(f !== "all")      l = l.filter(sh => sh.userStatus === f);

  const q = norm(state.ql).trim();
  if(q) l = l.filter(sh => norm(sh.name).includes(q));
  if(state.genre)      l = l.filter(sh => (sh.genres || []).includes(state.genre));
  if(state.plateforme) l = l.filter(sh => (sh.network || "—") === state.plateforme);
  if(state.diffusion === "running") l = l.filter(sh => sh.status === "Running");
  if(state.diffusion === "ended")   l = l.filter(sh => sh.status !== "Running");

  /* --- tri --- */
  const t = state.tri;
  const dNext = sh => { const e = prochainAVoir(sh); return e ? String(e.d) : "0"; };
  l = l.slice().sort((a, b) =>
      t === "activite" ? activiteDe(b) - activiteDe(a) || a.name.localeCompare(b.name)
    : t === "az"       ? a.name.localeCompare(b.name)
    : t === "progress" ? avancement(b).pct - avancement(a).pct || a.name.localeCompare(b.name)
    : t === "added"    ? (b.addedAt || 0) - (a.addedAt || 0)
    : t === "reste"    ? (tempsRestant(a) || 9e9) - (tempsRestant(b) || 9e9) || a.name.localeCompare(b.name)
    : t === "long"     ? tempsRestant(b) - tempsRestant(a) || a.name.localeCompare(b.name)
    : dNext(b).localeCompare(dNext(a)) || a.name.localeCompare(b.name));
  // quel que soit le tri, les archives ferment la marche
  l = l.filter(sh => !sh.archive).concat(l.filter(sh => sh.archive));

  /* --- facettes calculées sur la bibliothèque entière --- */
  const compte = (cle) => {
    const m = new Map();
    tout.forEach(sh => (cle === "genre" ? (sh.genres || []) : [sh.network || "—"])
      .forEach(x => m.set(x, (m.get(x) || 0) + 1)));
    return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  };
  const actifs = (state.genre ? 1 : 0) + (state.plateforme ? 1 : 0) + (state.diffusion ? 1 : 0);

  /* --- barre de recherche --- */
  const barre = '<div style="padding-top:14px"></div><div class="search">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gris)" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
    '<input id="ql" type="search" placeholder="Filtrer par titre…" autocomplete="off" value="' + esc(state.ql) + '">' +
    (state.ql ? '<button class="btn sm" data-act="vider-ql">Effacer</button>' : "") +
    '<button class="btn sm ' + (state.panneau || actifs ? "pri" : "") + '" data-act="panneau">Filtres' +
      (actifs ? " · " + actifs : "") + '</button></div>';

  /* --- panneau de facettes --- */
  const facette = (cle, sel, liste, titre) =>
    '<div class="eyebrow" style="margin:14px 0 8px">' + titre + '</div><div class="chips" style="flex-wrap:wrap">' +
    liste.slice(0, 24).map(([k, v]) =>
      '<button class="chip ' + (sel === k ? "on" : "") + '" data-act="' + cle + '" data-id="' + esc(k) + '">' +
      esc(k) + ' <b class="mono" style="opacity:.6">' + v + '</b></button>').join("") + '</div>';

  const panneau = state.panneau ? '<div class="box" style="margin-top:9px">' +
      facette("genre", state.genre, compte("genre"), "Genre") +
      facette("plateforme", state.plateforme, compte("network"), "Chaîne ou plateforme") +
      '<div class="eyebrow" style="margin:14px 0 8px">Diffusion</div><div class="chips">' +
        [["", "Peu importe"], ["running", "En production"], ["ended", "Terminée"]].map(([k, lb]) =>
          '<button class="chip ' + ((state.diffusion || "") === k ? "on" : "") + '" data-act="diffusion" data-id="' + k + '">' + lb + '</button>').join("") +
      '</div>' +
      (actifs ? '<button class="btn full" style="margin-top:14px" data-act="reset-filtres">Retirer les filtres</button>' : "") +
    '</div>' : "";

  /* --- chips de statut et de tri --- */
  const chips = '<div class="chips" style="margin-top:10px">' + FILTRES.map(x =>
    '<button class="chip ' + (f === x.id ? "on" : "") + '" data-act="filtre" data-id="' + x.id + '">' + x.l + '</button>').join("") + '</div>';

  const tris = '<div class="chips" style="margin-top:6px">' +
    [["recent","Diffusion"],["activite","Reprise"],["reste","Plus vite finie"],["long","Plus longue"],["az","A → Z"],["progress","Avancement"],["added","Ajout"]]
      .map(([id, lb]) => '<button class="chip ' + (t === id ? "on" : "") + '" data-act="tri" data-id="' + id + '">' + lb + '</button>').join("") + '</div>';

  /* --- corps --- */
  const resteTotal = l.filter(sh => !sh.archive).reduce((x, sh) => x + tempsRestant(sh), 0);
  const vus = l.slice(0, state.limite);
  const corps = l.length
    ? '<div class="stack">' + vus.map(carteSerie).join("") + '</div>' +
      (l.length > vus.length
        ? '<button class="btn full" style="margin-top:12px" data-act="plus">Afficher ' +
          Math.min(PAGE, l.length - vus.length) + ' séries de plus <span class="mono" style="color:var(--gris)">(' +
          vus.length + '/' + l.length + ')</span></button>' : "")
    : '<div class="empty"><h3>Aucun résultat</h3><p>Aucune série ne correspond à ces critères.</p>' +
      (actifs || q ? '<button class="btn" data-act="reset-filtres">Retirer les filtres</button>' : "") + '</div>';

  const titre = q ? 'Titres contenant « ' + esc(state.ql.trim()) + ' »'
                  : (FILTRES.find(x => x.id === f) || {}).l;

  return barre + panneau + chips + tris +
    '<div class="eyebrow">' + titre + ' <b>' + l.length + '</b>' +
      (resteTotal ? '<span style="color:var(--signal);letter-spacing:.04em">reste ' + dureeLongue(resteTotal) + '</span>' : "") +
    '</div>' + corps;
}

/* ============================================================
   FILMS
   Source : TMDb. Une clé API gratuite est nécessaire, à renseigner dans
   les Réglages ; elle ne quitte pas ce navigateur.
   Un film garde la liste datée de ses visionnages, comme un épisode.
   ============================================================ */
async function jsonLibre(url){
  const r = await fetch(url, { headers:{ Accept:"application/json" } });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const cleTMDB = () => (DB.settings && DB.settings.tmdb || "").trim();
const LANGUES = [["fr", "Français"], ["en", "English"]];
const LANGUE = () => ((DB.settings && DB.settings.langue) === "en" ? "en-US" : "fr-FR");
const langueNom = () => (LANGUE() === "en-US" ? "anglais" : "français");

function normFilmTMDB(x){
  return {
    id:"tmdb:" + x.id,
    titre:x.title || x.original_title || "Sans titre",
    annee:x.release_date ? String(x.release_date).slice(0, 4) : "",
    affiche:x.poster_path ? "https://image.tmdb.org/t/p/w342" + x.poster_path : null,
    duree:x.runtime || null,
    genres:(x.genres || []).map(g => g.name),
    resume:x.overview || "",
    realisateur:""
  };
}
async function chercherFilms(q){
  const cle = cleTMDB();
  if(!cle) throw new Error("clé TMDb absente");
  const d = await jsonLibre("https://api.themoviedb.org/3/search/movie?api_key=" + encodeURIComponent(cle) +
    "&language=" + LANGUE() + "&include_adult=false&query=" + encodeURIComponent(q));
  return (d.results || []).slice(0, 20).map(normFilmTMDB);
}
/* La recherche TMDb ne renvoie ni durée ni genres : on complète à l'ajout. */
async function completerFilm(f){
  const cle = cleTMDB();
  if(!cle || f.duree || !/^tmdb:/.test(f.id)) return f;
  const base = "https://api.themoviedb.org/3/movie/" + f.id.slice(5) + "?api_key=" + encodeURIComponent(cle);
  try{
    const d = await jsonLibre(base + "&language=" + LANGUE());
    const plein = { ...f, ...normFilmTMDB(d) };
    // TMDb n'a pas toujours de synopsis traduit : plutôt qu'un vide, on prend
    // celui d'origine.
    if(!plein.resume && LANGUE() !== "en-US"){
      try{
        const o = await jsonLibre(base + "&language=en-US");
        if(o && o.overview) plein.resume = o.overview;
      }catch(x){}
    }
    return plein;
  }catch(e){ return f; }
}

/* Réapplique la langue courante à toute la filmothèque. */
async function relangueFilms(){
  if(!cleTMDB()) return toast("Renseigne d'abord une clé TMDb");
  const l = Object.values(DB.films).filter(f => /^tmdb:/.test(f.id));
  if(!l.length) return toast("Aucun film à réactualiser");
  impr.ouvrir("fl");
  impr.dire(l.length + " films à repasser en " + langueNom() + ".");
  let ok = 0;
  for(let i = 0; i < l.length; i++){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    impr.avance(i + 1, l.length, (l.length - i) * 0.4);
    const f = l[i];
    const avant = f.titre;
    try{
      const maj = await completerFilm({ id:f.id });
      if(maj && maj.titre){
        f.titre = maj.titre; f.resume = maj.resume; f.affiche = maj.affiche;
        f.genres = maj.genres; f.duree = maj.duree; f.annee = maj.annee;
        sauverFilm(f); ok++;
        impr.dire("✓ " + f.titre + (f.titre !== avant ? "   ← " + avant : ""));
      }else impr.dire("✗ " + avant);
    }catch(e){ impr.dire("✗ " + avant); }
    await sleep(150);
  }
  impr.dire("\n" + ok + " films réactualisés en " + langueNom() + ".");
  impr.fermer(); render(); toast(ok + " films réactualisés");
}

const vuesFilm = f => Array.isArray(f.vu) ? f.vu : (f.vu ? [f.vu] : []);
const nbVuesFilm = f => vuesFilm(f).length;
function ajouterFilm(f, statut){
  const anc = DB.films[f.id] || {};
  DB.films[f.id] = {
    ...f,
    vu: anc.vu || [],
    statut: statut || anc.statut || "planned",
    archive: anc.archive || false,
    ajoute: anc.ajoute || Date.now(),
    activite: Date.now()
  };
  sauverFilm(DB.films[f.id]);
  return DB.films[f.id];
}
function retirerFilm(id){
  delete DB.films[id];
  sale.films.delete(String(id));
  sale.supprFilms.add(String(id));
  sauver();
}
function marquerFilm(f, on){
  const v = vuesFilm(f).slice();
  if(on) v.push(new Date().toISOString());
  else v.pop();
  f.vu = v;
  f.statut = v.length ? "watched" : "planned";
  f.activite = Date.now();
  state.vise = f.id;
  sauverFilm(f);
}

  return Object.values(DB.films).reduce((t, f) => t + nbVuesFilm(f) * (f.duree || 100), 0);

/* ---------- vue : Agenda ---------- */
function vueAgenda(){
  const out = [];
  Object.values(DB.shows).forEach(sh => {
    if(sh.userStatus === "dropped" || sh.archive) return;
    epsOf(sh).forEach(e => { if(e.d && e.d >= todayISO()) out.push({ sh, e }); });
  });
  out.sort((a, b) => a.e.d.localeCompare(b.e.d) || a.sh.name.localeCompare(b.sh.name));
  if(!out.length) return '<div class="empty" style="padding-top:60px"><h3>Rien de programmé</h3>' +
    '<p>Aucune date de diffusion connue pour tes séries.</p></div>';

  const t = todayISO();
  const dans = j => { const d = new Date(t + "T12:00:00"); d.setDate(d.getDate() + j);
    return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); };
  const s7 = dans(7), s30 = dans(31);
  const groupes = [
    ["Cette semaine", out.filter(x => x.e.d < s7)],
    ["Ce mois-ci",    out.filter(x => x.e.d >= s7 && x.e.d < s30)],
    ["Plus tard",     out.filter(x => x.e.d >= s30).slice(0, 60)]
  ];
  return groupes.filter(g => g[1].length).map(([titre, arr]) => {
    let jour = "";
    const lignes = arr.map(x => {
      let h = "";
      if(x.e.d !== jour){ jour = x.e.d;
        h = '<div class="eyebrow" style="margin:14px 0 8px">' + (x.e.d === t ? "Aujourd'hui · " : "") + frDate(x.e.d) + '</div>'; }
      return h + '<button class="card row" data-act="open" data-id="' + x.sh.id + '">' + affiche(x.sh) +
        '<div class="info"><div class="title" style="-webkit-line-clamp:1">' + esc(x.sh.name) + '</div>' +
        '<div style="margin-top:5px"><span class="code">S' + p2(x.e.s) + 'E' + p2(x.e.n || 0) + '</span></div>' +
        '<div class="sub" style="-webkit-line-clamp:1;margin-top:5px">' + esc(x.e.t || "Épisode") + '</div></div></button>';
    }).join("");
    return '<div class="eyebrow">' + titre + ' <b>' + arr.length + '</b></div><div class="stack">' + lignes + '</div>';
  }).join("");
}

/* ---------- vue : Stats ---------- */
function vueStats(){
  const shows = Object.values(DB.shows);
  if(!shows.length && !Object.keys(DB.films).length)
    return '<div class="empty" style="padding-top:60px"><h3>Pas encore de statistiques</h3>' +
    '<p>Elles apparaîtront dès tes premiers épisodes cochés.</p></div>';

  let mins = 0, total = 0, distincts = 0;
  const parSerie = [];
  shows.forEach(sh => {
    const m = tempsVu(sh);
    const eps = epsOf(sh);
    const t = eps.reduce((x, e) => x + nbVues(e), 0);
    const d = eps.filter(dejaVu).length;
    mins += m; total += t; distincts += d;
    if(t) parSerie.push({ n:sh.name, m, e:t });
  });
  parSerie.sort((a, b) => b.m - a.m);
  const finies = shows.filter(sh => sh.userStatus === "completed").length;
  const revus = shows.filter(sh => passe(sh) > 1).length;

  const cartes = [
    [total, "visionnages"], [dureeLongue(mins), "temps d'écran"],
    [distincts, "épisodes distincts"], [total - distincts, "revisionnages"],
    [shows.length, "séries suivies"], [finies + " / " + revus, "finies / revues"]
  ].map(([n, l]) => '<div class="stat"><div class="n">' + esc(n) + '</div><div class="l">' + l + '</div></div>').join("");

  // activité 12 mois
  const mois = [];
  const now = new Date();
  for(let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    mois.push({ k:d.getFullYear() + "-" + p2(d.getMonth()+1), l:MOIS[d.getMonth()][0].toUpperCase(), v:0 }); }
  const idx = Object.fromEntries(mois.map((m, i) => [m.k, i]));
  Object.values(DB.watched).forEach(v => (Array.isArray(v) ? v : [v]).forEach(ts => {
    const k = String(ts).slice(0, 7); if(k in idx) mois[idx[k]].v++; }));
  const maxM = Math.max(1, ...mois.map(m => m.v));
  const spark = '<div class="spark">' + mois.map(m =>
    '<div class="' + (m.v === maxM && m.v ? "hot" : "") + '" style="height:' + Math.max(3, m.v / maxM * 100) + '%" title="' + m.v + '"></div>').join("") + '</div>' +
    '<div class="sparkx">' + mois.map(m => '<span>' + m.l + '</span>').join("") + '</div>';

  const maxS = parSerie.length ? parSerie[0].m : 1;
  const top = parSerie.slice(0, 8).map(s => '<div class="bar"><div class="lb">' + esc(s.n) + '</div>' +
    '<div class="tr"><div class="fl" style="width:' + (s.m / maxS * 100) + '%"></div></div>' +
    '<div class="vl">' + dureeLongue(s.m) + '</div></div>').join("");

  const g = {};
  shows.forEach(sh => (sh.genres || []).forEach(x => { g[x] = (g[x] || 0) + 1; }));
  const genres = Object.entries(g).sort((a, b) => b[1] - a[1]).slice(0, 10)
    .map(([k, v]) => '<span class="chip">' + esc(k) + ' <b class="mono" style="color:var(--signal)">' + v + '</b></span>').join("");

  const films = Object.values(DB.films);
  const fVus = films.reduce((t, f) => t + nbVuesFilm(f), 0);
  const fDistincts = films.filter(f => nbVuesFilm(f)).length;
  const blocFilms = films.length
    ? '<div class="eyebrow">Films</div><div class="grid2">' +
      [[fVus, "visionnages"], [dureeLongue(tempsFilms()), "temps d\'écran"],
       [fDistincts + " / " + films.length, "vus / suivis"], [fVus - fDistincts, "revisionnages"]]
        .map(([x, l]) => '<div class="stat"><div class="n">' + esc(x) + '</div><div class="l">' + l + '</div></div>').join("") +
      '</div>' : "";

  return '<div class="eyebrow">Séries</div><div class="grid2">' + cartes + '</div>' + blocFilms +
    '<div class="eyebrow">Activité sur 12 mois</div><div class="box">' + spark + '</div>' +
    (top ? '<div class="eyebrow">Temps par série</div><div class="box">' + top + '</div>' : "") +
    (genres ? '<div class="eyebrow">Genres</div><div class="chips" style="flex-wrap:wrap">' + genres + '</div>' : "");
}

/* ---------- vue : Recherche ---------- */

      '<div class="sub">' + [sh.premiered ? sh.premiered.slice(0, 4) : "", sh.network, (sh.genres || []).slice(0, 2).join(", ")]

/* ---------- vue : fiche série ---------- */
const STATUTS = [["watching","En cours"],["planned","À voir"],["completed","Terminée"],["dropped","Abandonnée"]];
function vueFiche(sh){
  if(!sh) return "";
  const a = avancement(sh);
  const nx = prochainAVoir(sh), up = prochaineDiffusion(sh);
  const P = passe(sh);
  const saisons = [...new Set(epsOf(sh).map(e => e.s))].sort((x, y) => x - y);
  const ouvertes = state.saisons || new Set();

  const blocsSaisons = saisons.map(s => {
    const eps = epsOf(sh).filter(e => e.s === s);
    const w = eps.filter(e => vu(e, sh)).length;
    const tous = w === eps.length;
    return '<details class="season" data-saison="' + s + '" ' + (ouvertes.has(s) ? "open" : "") + '>' +
      '<summary><h3>' + (s === 0 ? "Spéciaux" : "Saison " + s) + '</h3>' +
      '<span class="mono" style="font-size:11px;color:var(--gris)">' + w + '/' + eps.length + '</span>' +
      (w ? '<span class="btn sm" data-act="season-revoir" data-id="' + sh.id + '" data-s="' + s + '" ' +
        'title="Compter un visionnage de plus pour toute la saison">↺</span>' : "") +
      '<span class="btn sm" data-act="season" data-id="' + sh.id + '" data-s="' + s + '" data-on="' + (tous ? 0 : 1) + '">' +
      (tous ? "Tout décocher" : "Tout cocher") + '</span></summary>' +
      eps.map(e => {
        const w2 = vu(e, sh), nv = nbVues(e);
        const der = nv ? vues(e)[nv - 1] : null;
        return '<div class="ep ' + (w2 ? "done" : "") + '">' +
          '<span class="code ' + (w2 ? "vu" : "") + '" style="flex:0 0 auto">S' + p2(e.s) + 'E' + p2(e.n || 0) + '</span>' +
          '<button class="epinfo" data-act="ep-info" data-id="' + sh.id + '" data-ep="' + e.i + '" title="Voir le résumé">' +
          '<div class="t">' + esc(e.t || "Épisode") + '</div>' +
          '<div class="mono" style="font-size:10.5px;color:var(--gris)">' +
          (der ? "vu le " + frDate(String(der).slice(0, 10)) : (e.d ? frDate(e.d) : "date inconnue")) +
          (e.r ? " · " + e.r + " min" : "") + '</div></button>' +
          (nv > 1 ? '<span class="xn" title="' + nv + ' visionnages">&times;' + nv + '</span>' : "") +
          (w2 ? '<button class="plus1" data-act="again" data-id="' + sh.id + '" data-ep="' + e.i + '" title="Compter un visionnage de plus" aria-label="Compter un visionnage de plus">+1</button>'
              : (diffuse(e) ? '<button class="upto" data-act="upto" data-id="' + sh.id + '" data-ep="' + e.i + '" title="Marquer vu jusqu\'ici" aria-label="Marquer vu jusqu\'ici">' + svg("down", 15) + '</button>' : "")) +
          '<button class="epchk ' + (w2 ? "on" : "") + '" data-act="tick" data-id="' + sh.id + '" data-ep="' + e.i + '" aria-label="Marquer vu">' + svg("check", 17) + '</button>' +
          '</div>' +
          (state.epOuvert === e.i
            ? '<div class="epres">' + (e.x === undefined ? "Chargement du résumé…"
                : e.x ? esc(e.x) : "Aucun résumé publié pour cet épisode.") + '</div>'
            : "");
      }).join("") + '</details>';
  }).join("");

  return '<div class="sheet">' +
    '<div class="sheetnav"><button class="iconbtn" data-act="close-sheet" aria-label="Retour">' + svg("back", 19) + '</button>' +
      '<div style="flex:1;font-family:Archivo;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(sh.name) + '</div>' +
      '<button class="btn sm" data-act="refresh-one" data-id="' + sh.id + '">Actualiser</button></div>' +
    '<div class="hero"><div class="row">' + affiche(sh, "lg") +
      '<div class="info"><h2 style="font-size:20px;line-height:1.15">' + esc(sh.name) + '</h2>' +
      '<div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">' + chipDiffusion(sh) +
        (sh.premiered ? '<span class="code">' + esc(sh.premiered.slice(0, 4) +
          (sh.ended ? "–" + sh.ended.slice(0, 4) : sh.status === "Running" ? "–" : "")) + '</span>' : "") +
        (sh.network ? '<span class="code">' + esc(sh.network) + '</span>' : "") +
        (sh.runtime ? '<span class="code">' + sh.runtime + ' min</span>' : "") + '</div>' +
      '<div class="sub" style="-webkit-line-clamp:2;margin-top:6px">' + esc((sh.genres || []).join(", ")) + '</div>' +
      bande(sh) +
      '<div class="stripmeta"><span>' + a.watched + '/' + a.total + ' épisodes</span>' +
      (tempsRestant(sh) ? '<span style="color:var(--signal)">reste ' + dureeLongue(tempsRestant(sh)) + '</span>' : "") +
      '<span>' + a.pct + ' % vus</span></div>' +
      '<div class="mono" style="font-size:11px;color:var(--vu);margin-top:7px">' + dureeLongue(tempsVu(sh)) + ' de visionnage' +
      (P > 1 ? ' · <span style="color:var(--signal)">passage ' + P + '</span>' : "") + '</div>' +
      (revuTexte(sh) ? '<div class="mono" style="font-size:11px;color:var(--gris);margin-top:3px">' + esc(revuTexte(sh).long) + '</div>' : "") +
      '</div></div>' +
      (nx ? '<button class="btn pri full" style="margin-top:14px" data-act="tick" data-id="' + sh.id + '" data-ep="' + nx.i + '">' +
        svg("check", 17) + ' Marquer S' + p2(nx.s) + 'E' + p2(nx.n || 0) + ' vu</button>'
        : up ? '<div class="box" style="margin-top:14px;text-align:center;font-size:13px">Prochain épisode <span class="code next">S' + p2(up.s) + 'E' + p2(up.n || 0) + '</span> ' + relDate(up.d) + '</div>'
        : '<div class="box" style="margin-top:14px;text-align:center;font-size:13px;color:var(--gris)">Aucun épisode en attente</div>') +
    '</div>' +
    '<div class="wrap" style="padding-bottom:60px">' +
      '<div class="eyebrow">Statut</div>' +
      '<div class="seg">' + STATUTS.map(([id, l]) =>
        '<button class="' + (sh.userStatus === id ? "on" : "") + '" data-act="statut" data-id="' + sh.id + '" data-v="' + id + '">' + l + '</button>').join("") + '</div>' +
      '<div class="eyebrow">Revisionnage</div>' +
      '<div class="box"><p class="note">' + (P > 1
        ? 'Tu en es au passage ' + P + '. Les épisodes se décochent à chaque nouveau passage et chaque visionnage reste compté dans tes statistiques.'
        : 'Repartir de S01E01 sans rien perdre : les épisodes se décochent, l\'historique et le temps d\'écran restent.') + '</p>' +
        '<div class="grid2" style="margin-top:11px">' +
          '<button class="btn" data-act="rewatch" data-id="' + sh.id + '">Revoir depuis le début</button>' +
          (P > 1 ? '<button class="btn dgr" data-act="unwatch" data-id="' + sh.id + '">Annuler le passage ' + P + '</button>' : '<span></span>') +
        '</div></div>' +
      (sh.summary ? '<div class="eyebrow">Synopsis</div><p class="summary">' + esc(sh.summary) + '</p>' : "") +
      '<div class="eyebrow">Épisodes <b>' + a.total + '</b></div>' +
      '<div class="stack">' + blocsSaisons + '</div>' +
      '<div class="eyebrow">Gestion</div>' +
      '<div class="grid2">' +
        '<button class="btn' + (sh.archive ? " pri" : "") + '" data-act="archiver" data-id="' + sh.id + '">' +
          svg("archive", 16) + (sh.archive ? " Sortir des archives" : " Archiver") + '</button>' +
        (sh.url ? '<a class="btn" href="' + esc(sh.url) + '" target="_blank" rel="noopener">Fiche TVmaze</a>' : '<span></span>') +
      '</div>' +
      '<button class="btn dgr full" style="margin-top:9px" data-act="remove" data-id="' + sh.id + '">' +
        svg("poubelle", 16) + ' Retirer la série</button>' +
    '</div></div>';
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act === "tab"){
    state.cherche = false;
    if(state.tab !== id){ state.limite = PAGE; state.limiteF = PAGE; state.vise = null; }
    state.tab = id; render(); window.scrollTo(0, 0); return;
  }
  if(act === "changelog"){
    state.cherche = false; state.tab = "reglages"; state.journal = true; state.neuf = false;
    DB.meta.vue = VERSION; sauver(); render();
    setTimeout(() => { const a = $("#anc-journal"); if(a) a.scrollIntoView({ behavior:"smooth", block:"start" }); }, 60);
    return;
  }
  if(act === "go-search"){
    state.cherche = true;
    state.cibleRecherche = state.tab === "films" ? "films" : "series";
    render(); setTimeout(() => { const q = $("#q"); if(q) q.focus(); }, 60); return;
  }
  if(act === "close-search"){ state.cherche = false; state.q = ""; state.res = []; state.resF = []; render(); return; }
  if(act === "filtre"){
    state.filtre = id; state.limite = PAGE;
    DB.settings.filtre = id; sauver();   // le choix est retenu d'une session à l'autre
    render(); window.scrollTo(0, 0); return;
  }
  if(act === "tri"){
    state.tri = id; state.limite = PAGE;
    DB.settings.tri = id; sauver();   // le choix est retenu d'une session à l'autre
    render(); window.scrollTo(0, 0); return;
  }
  if(act === "panneau"){ state.panneau = !state.panneau; render(); return; }
  if(act === "genre"){ state.genre = state.genre === id ? "" : id; state.limite = PAGE; render(); return; }
  if(act === "plateforme"){ state.plateforme = state.plateforme === id ? "" : id; state.limite = PAGE; render(); return; }
  if(act === "diffusion"){ state.diffusion = id; state.limite = PAGE; render(); return; }
  if(act === "reset-filtres"){
    state.genre = state.plateforme = state.diffusion = state.ql = "";
    state.limite = PAGE; render(); toast("Filtres retirés"); return;
  }
  if(act === "vider-ql"){ state.ql = ""; state.limite = PAGE; render(); return; }
  if(act === "plus"){ state.limite += PAGE; render(); return; }

  if(act === "open"){ ouvrirFiche(+id); return; }
  if(act === "open-f"){ ouvrirFicheFilm(id); return; }
  if(act === "add-f"){
    if(DB.films[id]){ retirerFilm(id); toast("Retiré de tes films"); render(); return; }
    const brut = state.resF.find(x => x.id === id);
    if(!brut) return;
    el.innerHTML = "…";
    const f = await completerFilm(brut);
    ajouterFilm(f, "planned");
    toast("« " + f.titre + " » ajouté");
    render(); return;
  }
  if(act === "tick-f"){
    const f = DB.films[id]; if(!f) return;
    marquerFilm(f, !nbVuesFilm(f));
    render(); return;
  }
  if(act === "again-f"){
    const f = DB.films[id]; if(!f) return;
    const v = vuesFilm(f).slice(); v.push(new Date().toISOString());
    f.vu = v; f.statut = "watched"; f.activite = Date.now(); state.vise = f.id;
    sauverFilm(f); toast("Visionnage n°" + v.length + " compté"); render(); return;
  }
  if(act === "archiver-f"){
    const f = DB.films[id]; if(!f) return;
    f.archive = !f.archive; sauverFilm(f); render();
    toast(f.archive ? "« " + f.titre + " » archivé" : "« " + f.titre + " » sorti des archives"); return;
  }
  if(act === "supprimer-f"){
    const f = DB.films[id]; if(!f) return;

  if(act === "rewatch"){

    state.limite = PAGE; state.detail = null;

function saisonCourante(sh){
  const eps = epsOf(sh);
  const nx = prochainAVoir(sh);
  const ss = [...new Set(eps.map(e => e.s))].sort((a, b) => a - b);
  state.saisons = new Set([nx ? nx.s : (ss.length ? ss[ss.length - 1] : 1)]);
}

  state.retour = window.scrollY;

  state.detail = id; state.animer = true;

function telecharger(nom, contenu, type){
  const b = new Blob([contenu], { type: type || "application/json" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 800);
}
function exportJSON(){
  telecharger("antenne-v" + VERSION + "-" + todayISO() + ".json",
    JSON.stringify({ ...DB, app:"antenne", appVersion:VERSION, schema:SCHEMA, exportedAt:new Date().toISOString() }, null, 1));
  toast("Sauvegarde v" + VERSION + " exportée");
}
function exportCSV(){
  const l = ['show_name,tvmaze_id,season,episode,episode_name,airdate,watched_at,view_no'];
  Object.values(DB.shows).forEach(sh => (sh.eps || []).forEach(e => {
    vues(e).forEach((d, k) => {
      l.push([sh.name, sh.id, e.s, e.n || "", e.t, e.d || "", d, k + 1]
        .map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(","));
    });
  }));
  telecharger("antenne-v" + VERSION + "-episodes-" + todayISO() + ".csv", l.join("\n"), "text/csv;charset=utf-8");
  toast(l.length - 1 + " visionnages exportés");
}

/* ---------- CSV : lecture ---------- */
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const tete = txt.slice(0, txt.indexOf("\n") > 0 ? txt.indexOf("\n") : 400);
  const sep = [",", ";", "\t"].sort((a, b) => (tete.split(b).length - tete.split(a).length))[0];
  const rows = []; let f = "", row = [], quote = false;
  for(let i = 0; i < txt.length; i++){
    const c = txt[i];
    if(quote){
      if(c === '"'){ if(txt[i+1] === '"'){ f += '"'; i++; } else quote = false; }
      else f += c;
    }else{
      if(c === '"') quote = true;
      else if(c === sep){ row.push(f); f = ""; }
      else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
  }
  if(f.length || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
function colonne(tete, exacts, partiels){
  let i = tete.findIndex(h => exacts.includes(h));
  if(i < 0 && partiels) i = tete.findIndex(h => partiels.some(p => h.includes(p)));
  return i;
}

/* ---------- lecture d'une archive ZIP ----------
   Les exports TV Time arrivent en .zip. Plutôt que de demander une extraction
   manuelle, on lit l'archive directement : en-têtes ZIP à la main, puis
   décompression par DecompressionStream, présent dans tous les navigateurs
   récents.                                                                */
async function lireZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let fin = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ fin = i; break; }
  }
  if(fin < 0) throw new Error("ce fichier n'est pas une archive ZIP lisible");
  const nb = dv.getUint16(fin + 10, true);
  let off = dv.getUint32(fin + 16, true);
  const dec = new TextDecoder();
  const entrees = new Map();
  for(let k = 0; k < nb; k++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const methode = dv.getUint16(off + 10, true);
    const tailleC = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nom = dec.decode(u8.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if(nom.endsWith("/")) continue;
    const lnLen = dv.getUint16(local + 26, true), leLen = dv.getUint16(local + 28, true);
    const debut = local + 30 + lnLen + leLen;
    entrees.set(nom.split("/").pop(), { methode, brut:u8.subarray(debut, debut + tailleC) });
  }
  return entrees;
}
async function extraire(e){
  if(e.methode === 0) return new TextDecoder().decode(e.brut);
  if(e.methode !== 8) throw new Error("compression non gérée");
  if(!window.DecompressionStream) throw new Error("ce navigateur ne sait pas décompresser les ZIP");
  const flux = new Blob([e.brut]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(flux).text();
}

async function importerFichier(f){

async function importerCSV(txt){
  impr.ouvrir("imp");
  const rows = parseCSV(txt);
  if(rows.length < 2){ impr.dire("Fichier vide ou illisible."); return impr.fermer(); }
