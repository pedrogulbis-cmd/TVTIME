  impr.dire(rows.length - 1 + " lignes lues.");
  return estTVTime(tete) ? importerTVTime(rows, tete) : importerGenerique(rows, tete);
}

/* ---------- format TV Time (tracking-prod-records-v2) ----------
   Une ligne par visionnage, préfixée watch-episode ou rewatch-episode.
   Les lignes user-series portent le suivi, l'archivage et « pour plus tard ».
   s_id est l'identifiant TVDB : la correspondance est exacte, sans deviner
   à partir du titre.                                                       */
async function importerTVTime(rows, tete){
  const c = k => tete.indexOf(k);
  const iKey = c("key"), iNom = c("series_name"), iSid = c("s_id"),
        iS = c("season_number"), iE = c("episode_number"), iD = c("created_at"),
        iFol = c("is_followed"), iArc = c("is_archived"), iLat = c("is_for_later");

  impr.dire("Format reconnu : export TV Time.");
  const series = new Map();
  const obtenir = (sid, nom) => {
    if(!series.has(sid)) series.set(sid, { sid, nom, suivi:true, archive:false, plusTard:false, vues:new Map() });
    const s = series.get(sid);
    if(nom && !s.nom) s.nom = nom;
    return s;
  };

  rows.slice(1).forEach(r => {
    const key = String(r[iKey] || "");
    const sid = String(r[iSid] || "").trim();
    if(!sid || !/^\d+$/.test(sid)) return;
    const s = obtenir(sid, String(r[iNom] || "").trim());
    if(key.startsWith("user-series")){
      s.suivi    = String(r[iFol]) === "true";
      s.archive  = String(r[iArc]) === "true";
      s.plusTard = String(r[iLat]) === "true";
    }else if(key.startsWith("watch-episode") || key.startsWith("rewatch-episode")){
      const se = parseInt(r[iS], 10), ep = parseInt(r[iE], 10);
      if(isNaN(se) || isNaN(ep)) return;
      const k2 = se + "-" + ep;
      if(!s.vues.has(k2)) s.vues.set(k2, []);
      s.vues.get(k2).push(r[iD] || null);
    }
  });

  const total = series.size;
  const nbVues2 = [...series.values()].reduce((t, s) => t + [...s.vues.values()].reduce((x, v) => x + v.length, 0), 0);
  impr.dire(total + " séries et " + nbVues2 + " visionnages à reprendre.");
  impr.dire("Compte environ " + dureeLongue(Math.ceil(total * 1.1 / 60)) + ". Laisse cet onglet ouvert.\n");

  let ok = 0, coches = 0, revus = 0, arch = 0;
  const rates = [];
  let i = 0;
  for(const s of series.values()){
    if(state.annuler){ impr.dire("\nInterrompu. Les " + ok + " premières séries sont enregistrées."); break; }
    i++;
    impr.avance(i, total, (total - i) * 1.1);
    try{
      let sh = Object.values(DB.shows).find(x => String(x.tvdb) === s.sid);
      if(!sh){
        const lk = await net.get(API + "/lookup/shows?thetvdb=" + s.sid);
        if(lk) sh = await fetchShow(lk.id);
      }
      if(!sh && s.nom){
        const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(s.nom) + "&embed=episodes");
        if(r){ sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); }
      }
      if(!sh){ rates.push(s.nom || s.sid); impr.dire("✗ " + (s.nom || "TVDB " + s.sid)); continue; }

      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      let c2 = 0, r2 = 0;
      s.vues.forEach((dates, k2) => {
        const [se, ep] = k2.split("-").map(Number);
        const e = (cible.eps || []).find(x => x.s === se && x.n === ep);
        if(!e) return;
        const avant = vues(e).length;
        const cur = vues(e).slice();
        while(cur.length < dates.length){
          const d = dates[cur.length];
          const t = d ? new Date(String(d).replace(" ", "T") + "Z") : null;
          cur.push(t && !isNaN(t) ? t.toISOString() : new Date().toISOString());
        }
        if(cur.length > avant){ c2++; r2 += Math.max(0, dates.length - 1); poser(e, cur); }
      });

      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      cible.archive = !!s.archive;
      if(s.archive) arch++;
      if(s.plusTard) cible.userStatus = "planned";
      else if(!s.suivi && !s.vues.size) cible.userStatus = "planned";
      const air = epsOf(cible).filter(diffuse);
      if(air.length) cible.pass = Math.max(1, Math.min.apply(null, air.map(nbVues)));
      autoStatut(cible); sauverShow(cible);

      coches += c2; revus += r2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "") +
        (r2 ? "  +" + r2 + " revisionnages" : "") +
        (cible.pass > 1 ? "  passage " + cible.pass : "") +
        (s.archive ? "  [archivée]" : ""));
    }catch(e){
      rates.push(s.nom || s.sid);
      impr.dire("✗ " + (s.nom || s.sid) + " (" + (e && e.message || e) + ")");
    }
  }
  impr.avance(total, total);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes, " + revus + " revisionnages, " + arch + " archivées." +
    (rates.length ? "\nNon retrouvées (" + rates.length + ") : " + rates.slice(0, 20).join(", ") + (rates.length > 20 ? "…" : "") : ""));
  impr.fermer();
  toast(ok + " séries importées");
  majQuota();
}

/* ============================================================
   BetaSeries — deux fichiers complémentaires
   series-*.csv   : id, title, archive, episode (dernier vu), remaining, status
   episodes-*.csv : id, show, episode (SxxEyy), title, date, note
   Pas d'identifiant TVDB ici : la correspondance se fait sur le titre, avec
   plusieurs tentatives. Pas de revisionnage dans cet export non plus, chaque
   épisode n'y figure qu'une fois.
   ============================================================ */
const estBSseries  = t => t.includes("title") && t.includes("archive") && t.includes("remaining");
const estBSepisode = t => t.includes("show") && t.includes("episode") && t.includes("date");
const estBSfilms   = t => t.includes("title") && t.includes("status") && t.includes("date") &&
                          !t.includes("show") && !t.includes("archive") && !t.includes("episode");
const lireSE = v => {
  const m = /^S(\d+)E(\d+)$/i.exec(String(v || "").trim());
  if(!m) return null;
  const se = { s:+m[1], n:+m[2] };
  return se.s === 0 && se.n === 0 ? null : se;   // S00E00 = rien de vu
};

async function importerBS(fichiers){
  impr.ouvrir("bs");
  try{
    const csvs = [];
    for(const f of fichiers){
      if(/\.zip$/i.test(f.name)){
        impr.dire("Ouverture de " + f.name + "…");
        const zip = await lireZip(await f.arrayBuffer());
        for(const [nom, e] of zip) if(/\.csv$/i.test(nom)) csvs.push({ nom, txt:await extraire(e) });
      }else{
        csvs.push({ nom:f.name, txt:await f.text() });
      }
    }
    let rSeries = null, rEpisodes = null, rFilms = null;
    for(const c of csvs){
      const rows = parseCSV(c.txt);
      if(rows.length < 2) continue;
      const tete = rows[0].map(h => h.toLowerCase().trim());
      if(estBSseries(tete))       { rSeries = { rows, tete };   impr.dire("Séries : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
      else if(estBSepisode(tete)) { rEpisodes = { rows, tete }; impr.dire("Épisodes : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
      else if(estBSfilms(tete))   { rFilms = { rows, tete };    impr.dire("Films : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
    }
    if(!rSeries && !rEpisodes && !rFilms){
      impr.dire("Aucun fichier BetaSeries reconnu. Attendu : series-*.csv, episodes-*.csv, films-*.csv.");
      return impr.fermer();
    }
    if(rSeries || rEpisodes) await importerBetaSeries(rSeries, rEpisodes, !!rFilms);
    if(rFilms) await importerFilmsBS(rFilms);
    impr.fermer(); majQuota();
  }catch(e){
    impr.dire("Échec : " + (e && e.message || e));
    impr.fermer();
  }
}

/* Correspondance par titre, du plus précis au plus large. */
async function trouverParTitre(titre){
  const nu = titre.replace(/\s*\((19|20)\d{2}\)\s*$/, "").trim();
  for(const t of (nu && nu !== titre ? [titre, nu] : [titre])){
    const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(t) + "&embed=episodes");
    if(r){ const sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); return sh; }
  }
  const res = await net.get(API + "/search/shows?q=" + encodeURIComponent(nu || titre));
  if(res && res.length){
    const cible = norm(nu || titre);
    const m = res.find(x => norm(x.show.name) === cible);
    if(m) return await fetchShow(m.show.id);
  }
  return null;
}

async function importerBetaSeries(rSeries, rEpisodes, encore){
  const series = new Map();   // titre → { titre, archive, dernier }
  const vusPar = new Map();   // titre → Map("s-n" → date)

  if(rSeries){
    const c = k => rSeries.tete.indexOf(k);
    const iT = c("title"), iA = c("archive"), iE = c("episode");
    rSeries.rows.slice(1).forEach(r => {
      const titre = String(r[iT] || "").trim();
      if(!titre) return;
      series.set(titre, { titre, archive:String(r[iA]).trim() === "1", dernier:lireSE(r[iE]) });
    });
  }
  if(rEpisodes){
    const c = k => rEpisodes.tete.indexOf(k);
    const iS = c("show"), iE = c("episode"), iD = c("date");
    rEpisodes.rows.slice(1).forEach(r => {
      const titre = String(r[iS] || "").trim();
      const se = lireSE(r[iE]);
      if(!titre || !se) return;
      if(!series.has(titre)) series.set(titre, { titre, archive:false, dernier:null });
      if(!vusPar.has(titre)) vusPar.set(titre, new Map());
      vusPar.get(titre).set(se.s + "-" + se.n, r[iD] || null);
    });
  }

  const total = series.size;
  const nbEp = [...vusPar.values()].reduce((t, m) => t + m.size, 0);
  impr.dire("\n" + total + " séries et " + nbEp + " épisodes vus à reprendre.");
  impr.dire("Correspondance par titre — compte environ " + dureeLongue(Math.ceil(total * 0.6 / 60)) +
            ". Laisse cet onglet ouvert.\n");

  let ok = 0, coches = 0, arch = 0, deduits = 0;
  const rates = []; let i = 0;
  for(const s of series.values()){
    if(state.annuler){ impr.dire("\nInterrompu. Les " + ok + " premières séries sont enregistrées."); break; }
    i++; impr.avance(i, total, (total - i) * 0.6);
    try{
      let sh = Object.values(DB.shows).find(x => norm(x.name) === norm(s.titre));
      if(!sh) sh = await trouverParTitre(s.titre);
      if(!sh){ rates.push(s.titre); impr.dire("✗ " + s.titre); continue; }

      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      const liste = vusPar.get(s.titre);
      let c2 = 0, mode = "";

      if(liste && liste.size){
        liste.forEach((d, k) => {
          const [se, ep] = k.split("-").map(Number);
          const e = (cible.eps || []).find(x => x.s === se && x.n === ep);
          if(!e || vues(e).length) return;
          const t = d ? new Date(String(d).replace(" ", "T") + "Z") : null;
          poser(e, [t && !isNaN(t) ? t.toISOString() : new Date().toISOString()]);
          c2++;
        });
      }else if(s.dernier){
        // Pas de détail épisode par épisode : on se fie au dernier vu déclaré.
        const eps = epsOf(cible);
        const fin = eps.findIndex(e => e.s === s.dernier.s && e.n === s.dernier.n);
        if(fin >= 0){
          eps.slice(0, fin + 1).filter(diffuse).forEach(e => { if(!vues(e).length){ poser(e, [new Date().toISOString()]); c2++; } });
          mode = " (déduit du dernier épisode vu)";
          deduits++;
        }
      }

      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      cible.archive = !!s.archive;
      if(s.archive) arch++;
      if(!c2 && !avancement(cible).watched) cible.userStatus = "planned";
      autoStatut(cible); sauverShow(cible);
      coches += c2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "  rien de vu") + mode + (s.archive ? "  [archivée]" : ""));
    }catch(e){
      rates.push(s.titre);
      impr.dire("✗ " + s.titre + " (" + (e && e.message || e) + ")");
    }
  }
  impr.avance(total, total);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes, " + arch + " archivées" +
    (deduits ? ", " + deduits + " déduites du dernier épisode" : "") + "." +
    (rates.length ? "\nNon retrouvées (" + rates.length + ") : " + rates.slice(0, 25).join(", ") + (rates.length > 25 ? "…" : "") : ""));
  toast(ok + " séries importées");
  if(!encore){ impr.fermer(); majQuota(); }
}

/* ---------- films BetaSeries ----------
   films-*.csv : id, title, status (1 = vu, 0 = à voir), date.
   L'identifiant est propre à BetaSeries : la correspondance passe par le
   titre, y compris en écriture d'origine (狼图腾, 부산행), que TMDb indexe. */
async function importerFilmsBS(rF){

  })).filter(x => x.titre);

    return;
  }

  impr.dire("\n" + films.length + " films à reprendre.");
  let ok = 0, vus = 0; const rates = []; let i = 0;
  for(const f of films){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    i++; impr.avance(i, films.length, (films.length - i) * 0.5);

        const d = f.date && !isNaN(new Date(f.date)) ? new Date(f.date).toISOString() : new Date().toISOString();
        fi.vu = [d]; fi.statut = "watched"; sauverFilm(fi);

      }

  toast(ok + " films importés");
}

/* ---------- CSV d'origine quelconque ---------- */
async function importerGenerique(rows, tete){
  const cN = colonne(tete, ["show_name","series_name","serie","série","show","series","title","name","tv_show","show name"], ["show","serie","title"]);
  const cS = colonne(tete, ["season_number","season","saison","season_no","s"], ["season","saison"]);
  const cE = colonne(tete, ["episode_number","episode","épisode","number","episode_no","e"], ["episode","épisode","number"]);
  const cT = colonne(tete, ["tvdb_id","thetvdb_id","tvdb","series_id","show_id","s_id"], ["tvdb"]);
  const cD = colonne(tete, ["watched_at","created_at","date_watched","last_watched","updated_at","date","timestamp"], ["watched","date"]);

  impr.dire("Colonnes détectées : " + ([cN >= 0 ? "série=" + tete[cN] : null, cS >= 0 ? "saison=" + tete[cS] : null,
       cE >= 0 ? "épisode=" + tete[cE] : null, cT >= 0 ? "tvdb=" + tete[cT] : null].filter(Boolean).join("  ") || "aucune"));
  if(cN < 0 && cT < 0){ impr.dire("Impossible de repérer la série : il faut une colonne de titre ou d'identifiant TVDB."); return impr.fermer(); }
  if(cS < 0 || cE < 0) impr.dire("Pas de colonne saison/épisode : les séries seront ajoutées sans cocher d'épisode.");

  const groupes = new Map();
  rows.slice(1).forEach(r => {
    const nom = cN >= 0 ? String(r[cN] || "").trim() : "";
    const tv  = cT >= 0 ? String(r[cT] || "").trim() : "";
    const cle = nom || (tv ? "tvdb:" + tv : "");
    if(!cle) return;
    if(!groupes.has(cle)) groupes.set(cle, { nom, tvdb:/^\d+$/.test(tv) ? tv : null, eps:[] });
    if(cS >= 0 && cE >= 0){
      const s2 = parseInt(r[cS], 10), n2 = parseInt(r[cE], 10);
      if(!isNaN(s2) && !isNaN(n2)) groupes.get(cle).eps.push({ s:s2, n:n2, d: cD >= 0 ? r[cD] : null });
    }
  });

  impr.dire(groupes.size + " séries repérées.");
  let ok = 0, coches = 0; const rates = []; let i = 0;
  for(const [cle, g] of groupes){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    i++; impr.avance(i, groupes.size, (groupes.size - i) * 1.1);
    const etiquette = g.nom || cle;
    try{
      let sh = Object.values(DB.shows).find(x => x.name.toLowerCase() === etiquette.toLowerCase() || (g.tvdb && String(x.tvdb) === g.tvdb));
      if(!sh && g.tvdb){
        const lk = await net.get(API + "/lookup/shows?thetvdb=" + g.tvdb);
        if(lk) sh = await fetchShow(lk.id);
      }
      if(!sh && g.nom){
        const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(g.nom) + "&embed=episodes");
        if(r){ sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); }
      }
      if(!sh){ rates.push(etiquette); impr.dire("✗ " + etiquette); continue; }
      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      let c2 = 0, rw = 0;
      const paquet = new Map();
      g.eps.forEach(x => { const k = x.s + "-" + x.n; if(!paquet.has(k)) paquet.set(k, []); paquet.get(k).push(x.d); });
      paquet.forEach((dates, k) => {
        const [s2, n2] = k.split("-").map(Number);
        const e = (cible.eps || []).find(x => x.s === s2 && x.n === n2);
        if(!e) return;
        const avant = vues(e).length;
        const cur = vues(e).slice();
        while(cur.length < dates.length){
          const d = dates[cur.length];
          cur.push(d && !isNaN(new Date(d)) ? new Date(d).toISOString() : new Date().toISOString());
        }
        if(cur.length > avant){ c2++; rw += Math.max(0, dates.length - 1); poser(e, cur); }
      });
      const air = epsOf(cible).filter(diffuse);
      if(air.length) cible.pass = Math.max(1, Math.min.apply(null, air.map(nbVues)));
      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      autoStatut(cible); sauverShow(cible);
      coches += c2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "") + (rw ? "  +" + rw + " revisionnages" : ""));
    }catch(e){ rates.push(etiquette); impr.dire("✗ " + etiquette + " (" + (e && e.message || e) + ")"); }
  }
  impr.avance(groupes.size, groupes.size);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes." + (rates.length ? " " + rates.length + " non trouvées." : ""));
  impr.fermer();
  toast(ok + " séries importées");
  majQuota();
}

async function importerListe(){
  const ta = $("#ta-list"); if(!ta) return;
  const noms = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
  if(!noms.length) return toast("Aucun titre saisi");
  const bar = $("#imp-bar"), log = $("#imp-log");
  bar.classList.remove("hide"); log.classList.remove("hide"); log.textContent = "";
  let ok = 0;
  for(let i = 0; i < noms.length; i++){
    bar.firstElementChild.style.width = Math.round((i + 1) / noms.length * 100) + "%";
    try{
      const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(noms[i]) + "&embed=episodes");
      if(r){ const sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes);
        if(!DB.shows[sh.id]) ajouterShow(sh, "planned");
        ok++; log.textContent += "✓ " + sh.name + "\n"; }
      else log.textContent += "✗ " + noms[i] + "\n";
    }catch(e){ log.textContent += "✗ " + noms[i] + "\n"; }
    log.scrollTop = log.scrollHeight;
  }
  sauver(); toast(ok + " séries ajoutées");
}

async function actualiserTout(){
  const l = Object.values(DB.shows);
  if(!l.length) return toast("Aucune série à actualiser");
  const bar = $("#imp-bar"), log = $("#imp-log");
  bar.classList.remove("hide"); log.classList.remove("hide"); log.textContent = "";
  for(let i = 0; i < l.length; i++){
    bar.firstElementChild.style.width = Math.round((i + 1) / l.length * 100) + "%";
    try{
      const sh = await fetchShow(l[i].id);
      if(sh) ajouterShow(sh, l[i].userStatus);
      log.textContent += "✓ " + l[i].name + "\n";
    }catch(e){ log.textContent += "✗ " + l[i].name + "\n"; }
    log.scrollTop = log.scrollHeight;
  }
  sauver(); toast("Séries actualisées");
}

/* ---------- fichiers ---------- */
document.addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  if(ev.target.id === "f-json"){
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d.shows) throw new Error("format inattendu");
        if((d.schema || 1) > SCHEMA){
          if(!confirm("Cette sauvegarde vient d'une version plus récente d'Antenne (schéma " + d.schema +
            ", cette page gère le " + SCHEMA + "). Des données peuvent être ignorées. Continuer ?")) return;
        }
        let ns = 0, ne = 0;
        Object.entries(d.shows).forEach(([k, v]) => { if(!DB.shows[k]){ DB.shows[k] = { pass:1, ...v }; ns++; } });
        let nf = 0;
        Object.entries(d.films || {}).forEach(([k, v]) => { if(!DB.films[k]){ DB.films[k] = v; nf++; } });
        Object.entries(d.watched || {}).forEach(([k, v]) => {
          const inc = Array.isArray(v) ? v : (v ? [v] : []);
          const cur = Array.isArray(DB.watched[k]) ? DB.watched[k] : (DB.watched[k] ? [DB.watched[k]] : []);
          const fus = [...new Set([...cur, ...inc])].sort();
          if(fus.length > cur.length){ ne += fus.length - cur.length; DB.watched[k] = fus; }
        });
        Object.keys(DB.watched).forEach(k => { if(!Array.isArray(DB.watched[k])) DB.watched[k] = [DB.watched[k]]; });
        Object.values(DB.shows).forEach(sh => { if(!sh.pass) sh.pass = 1; });
        toutSalir(); render();
        toast(ns + " séries, " + nf + " films et " + ne + " visionnages ajoutés" + (d.appVersion ? " (sauvegarde v" + d.appVersion + ")" : ""));
      }catch(e){ toast("Fichier illisible : " + e.message); }
    };
    rd.readAsText(f);
  }
  if(ev.target.id === "f-csv"){ importerFichier(f); ev.target.value = ""; return; }
  if(ev.target.id === "f-bs"){ importerBS([...ev.target.files]); ev.target.value = ""; return; }
  ev.target.value = "";
});

/* ---------- rafraîchissement discret des séries en cours ---------- */
async function majAuto(){
  const seuil = Date.now() - 3 * 86400000;
  const l = Object.values(DB.shows)
    .filter(sh => sh.status === "Running" && sh.userStatus !== "dropped" && (sh.lastFetched || 0) < seuil)
    .slice(0, 6);
  for(const s of l){
    try{ const sh = await fetchShow(s.id); if(sh) ajouterShow(sh, s.userStatus); }catch(e){}
  }
  if(l.length){ sauver(); if(!state.detail && !state.cherche) render(); }
}

/* ---------- démarrage ---------- */
function echec(msg, detail){
  $("#view").innerHTML = '<div class="empty" style="padding-top:60px"><h3>' + esc(msg) + '</h3>' +
    '<p>' + esc(detail || "") + '</p>' +
    '<button class="btn" onclick="location.reload()">Recharger la page</button></div>';
}

async function demarrer(){
  $("#view").innerHTML = '<div class="empty" style="padding-top:70px"><p>Ouverture de la bibliothèque…</p></div>';
  try{ await IDB.ouvrir(); }
  catch(e){
    echec("Stockage inaccessible",
      "Ce navigateur refuse d'ouvrir la base locale. C'est le cas en navigation privée sur certains navigateurs, ou si un autre onglet d'Antenne est en cours de mise à jour.");
    return;
  }
  try{
    let k = await IDB.tout();
    let repris = 0;
    // Reprise unique de l'ancien stockage localStorage, qui n'est pas effacé.
    if(!(k.kv.meta && k.kv.meta.repris) && !k.shows.length && localStorage.getItem(LS)){
      repris = await reprendreLocalStorage();
      k = await IDB.tout();
    }
    DB = assembler(k);
    pret = true;
    if(DB.settings.theme){ localStorage.setItem(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
    if(DB.settings.tri) state.tri = DB.settings.tri;
    if(DB.settings.filtre) state.filtre = DB.settings.filtre;
    if(repris) setTimeout(() => toast(repris + " séries reprises depuis l'ancien stockage"), 800);
  }catch(e){
    echec("Lecture impossible", String(e && e.message || e));
    return;
  }

  // Nouvelle installation : rien à signaler. Données existantes : on signale la mise à jour.
  if(DB.meta.vue !== VERSION){
    if(!Object.keys(DB.shows).length && !DB.meta.vue){ DB.meta.vue = VERSION; sauver(); }
    else{
      state.neuf = true;
      setTimeout(() => toast("Antenne est passée en v" + VERSION + " — voir les nouveautés"), 1500);
    }
  }

  render();
  majQuota();
  setTimeout(majAuto, 2500);
}

// Écriture immédiate quand l'onglet passe en arrière-plan ou se ferme.
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") ecouler(); });
window.addEventListener("pagehide", ecouler);

demarrer();
</script>
