/* ---------- activité datée ----------
   Tous les visionnages, épisodes et films confondus, regroupés par jour.
   La bibliothèque en compte des dizaines de milliers : on indexe une fois. */
function activiteParJour(){
  const m = new Map();
  const compter = ts => {
    const k = String(ts).slice(0, 10);
    if(k.length === 10) m.set(k, (m.get(k) || 0) + 1);
  };
  Object.values(DB.watched).forEach(v => (Array.isArray(v) ? v : [v]).forEach(compter));
  Object.values(DB.films).forEach(f => (f.vu || []).forEach(compter));
  return m;
}
function indexEpisodes(){
  const m = new Map();
  Object.values(DB.shows).forEach(sh => (sh.eps || []).forEach(e => m.set(String(e.i), { sh, e })));
  return m;
}
const niveau = n => n >= 7 ? 4 : n >= 4 ? 3 : n >= 2 ? 2 : n >= 1 ? 1 : 0;

function carteAnnee(an, jours){
  const debut = new Date(an + "-01-01T12:00:00");
  const cases = [], entetes = [];
  const d = new Date(debut);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // reculer au lundi
  let moisVu = -1;
  for(let c = 0; c < 53; c++){
    const premier = new Date(d);
    premier.setDate(premier.getDate() + c * 7);
    const m = premier.getMonth();
    entetes.push(premier.getFullYear() === +an && m !== moisVu && premier.getDate() <= 7
      ? (moisVu = m, MOIS[m][0].toUpperCase()) : "");
    for(let j = 0; j < 7; j++){
      const jour = new Date(d);
      jour.setDate(jour.getDate() + c * 7 + j);
      if(jour.getFullYear() !== +an){ cases.push('<i class="o"></i>'); continue; }
      const k = jour.getFullYear() + "-" + p2(jour.getMonth() + 1) + "-" + p2(jour.getDate());
      const n = jours.get(k) || 0;
      cases.push(n
        ? '<i class="n' + niveau(n) + '" title="' + frDate(k) + ' — ' + n + ' visionnage' + (n > 1 ? "s" : "") + '"></i>'
        : '<i></i>');
    }
  }
  return '<div class="hmx">' + entetes.map(x => '<span>' + x + '</span>').join("") + '</div>' +
    '<div class="hm">' + cases.join("") + '</div>' +
    '<div class="hml"><span>moins</span><i></i><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="n4"></i><span>plus</span></div>';
}

/* ---------- bilan de toutes les années, en un seul parcours ----------
   La bibliothèque compte des dizaines de milliers de dates : on les traverse
   une fois en répartissant dans l'année correspondante, plutôt que de
   recalculer chaque année séparément à chaque affichage. */
function bilanParAnnee(){
  const idx = indexEpisodes();
  const ans = new Map();
  const obtenir = a => {
    if(!ans.has(a)) ans.set(a, { eps:0, mins:0, films:0, minsF:0,
      parSerie:new Map(), parMois:new Array(12).fill(0), jours:new Map() });
    return ans.get(a);
  };
  Object.keys(DB.watched).forEach(k => {
    const v = DB.watched[k];
    if(!Array.isArray(v)) return;
    const ref = idx.get(String(k));
    v.forEach(ts => {
      const st = String(ts), an = st.slice(0, 4), jour = st.slice(0, 10);
      if(!/^\d{4}$/.test(an)) return;
      const o = obtenir(an);
      o.jours.set(jour, (o.jours.get(jour) || 0) + 1);
      if(!ref) return;                 // visionnage orphelin : compté au jour, rattaché à aucune série
      o.eps++;
      o.mins += ref.e.r || ref.sh.runtime || 42;
      o.parMois[+st.slice(5, 7) - 1]++;
      o.parSerie.set(ref.sh.name, (o.parSerie.get(ref.sh.name) || 0) + 1);
    });
  });
  Object.values(DB.films).forEach(f => (f.vu || []).forEach(ts => {
    const st = String(ts), an = st.slice(0, 4), jour = st.slice(0, 10);
    if(!/^\d{4}$/.test(an)) return;
    const o = obtenir(an);
    o.jours.set(jour, (o.jours.get(jour) || 0) + 1);
    o.films++;
    o.minsF += f.duree || 100;
  }));
  return ans;
}

    '<p>Elles apparaîtront dès tes premiers épisodes cochés.</p></div>';

  let mins = 0, total = 0, distincts = 0;
  const parSerie = [];
  shows.forEach(sh => {
    const m = tempsVu(sh);
    const eps = epsOf(sh);
    const t = eps.reduce((x, e) => x + nbVues(e), 0);
    const d = eps.filter(dejaVu).length;
    mins += m; total += t; distincts += d;
    if(t) parSerie.push({ n:sh.name, m, e:t });
  });
  parSerie.sort((a, b) => b.m - a.m);
  const finies = shows.filter(sh => sh.userStatus === "completed").length;
  const revus = shows.filter(sh => passe(sh) > 1).length;

  const cartes = [
    [total, "visionnages"], [dureeLongue(mins), "temps d'écran"],
    [distincts, "épisodes distincts"], [total - distincts, "revisionnages"],
    [shows.length, "séries suivies"], [finies + " / " + revus, "finies / revues"]
  ].map(([n, l]) => '<div class="stat"><div class="n">' + esc(n) + '</div><div class="l">' + l + '</div></div>').join("");

  // activité 12 mois
  const mois = [];
  const now = new Date();
  for(let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    mois.push({ k:d.getFullYear() + "-" + p2(d.getMonth()+1), l:MOIS[d.getMonth()][0].toUpperCase(), v:0 }); }
  const idx = Object.fromEntries(mois.map((m, i) => [m.k, i]));
  Object.values(DB.watched).forEach(v => (Array.isArray(v) ? v : [v]).forEach(ts => {
    const k = String(ts).slice(0, 7); if(k in idx) mois[idx[k]].v++; }));
  const maxM = Math.max(1, ...mois.map(m => m.v));
  const spark = '<div class="spark">' + mois.map(m =>
    '<div class="' + (m.v === maxM && m.v ? "hot" : "") + '" style="height:' + Math.max(3, m.v / maxM * 100) + '%" title="' + m.v + '"></div>').join("") + '</div>' +
    '<div class="sparkx">' + mois.map(m => '<span>' + m.l + '</span>').join("") + '</div>';

  const maxS = parSerie.length ? parSerie[0].m : 1;
  const top = parSerie.slice(0, 8).map(s => '<div class="bar"><div class="lb">' + esc(s.n) + '</div>' +
    '<div class="tr"><div class="fl" style="width:' + (s.m / maxS * 100) + '%"></div></div>' +
    '<div class="vl">' + dureeLongue(s.m) + '</div></div>').join("");

  const g = {};
  shows.forEach(sh => (sh.genres || []).forEach(x => { g[x] = (g[x] || 0) + 1; }));
  const genres = Object.entries(g).sort((a, b) => b[1] - a[1]).slice(0, 10)
    .map(([k, v]) => '<span class="chip">' + esc(k) + ' <b class="mono" style="color:var(--signal)">' + v + '</b></span>').join("");

  const films = Object.values(DB.films);
  const fVus = films.reduce((t, f) => t + nbVuesFilm(f), 0);
  const fDistincts = films.filter(f => nbVuesFilm(f)).length;
  const blocFilms = films.length
    ? '<div class="eyebrow">Films</div><div class="grid2">' +
      [[fVus, "visionnages"], [dureeLongue(tempsFilms()), "temps d\'écran"],
       [fDistincts + " / " + films.length, "vus / suivis"], [fVus - fDistincts, "revisionnages"]]
        .map(([x, l]) => '<div class="stat"><div class="n">' + esc(x) + '</div><div class="l">' + l + '</div></div>').join("") +
      '</div>' : "";

  const parAn = bilanParAnnee();
  const ans = [...parAn.keys()].sort((a, b) => b.localeCompare(a));
  if(ans.length && !state.ansOuvertes) state.ansOuvertes = new Set([ans[0]]);
  const ouvertes = state.ansOuvertes || new Set();

  const blocAnnee = ans.length ? '<div class="eyebrow">Rétrospective</div><div class="stack">' + ans.map(an => {
    const r = parAn.get(an);
    const ouvert = ouvertes.has(an);
    const resume = [r.eps ? r.eps + " ép." : "", r.films ? r.films + " films" : "",
                    dureeLongue(r.mins + r.minsF)].filter(Boolean).join(" · ");
    const dedans = (function(){
      const bilan = [
        [r.eps, "épisodes"], [dureeLongue(r.mins + r.minsF), "d\'écran"],
        [r.films, "films"], [r.jours.size, "jours actifs"]
      ].map(([x, l]) => '<div class="stat" style="padding:10px"><div class="n" style="font-size:20px">' + esc(x) +
        '</div><div class="l">' + l + '</div></div>').join("");
      const top = [...r.parSerie.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
      const maxS = top.length ? top[0][1] : 1;
      const palmares = top.map(([nom, n]) => '<div class="bar"><div class="lb">' + esc(nom) + '</div>' +
        '<div class="tr"><div class="fl" style="width:' + (n / maxS * 100) + '%"></div></div>' +
        '<div class="vl">' + n + ' ép.</div></div>').join("");
      let record = ["", 0];
      r.jours.forEach((v, k) => { if(v > record[1]) record = [k, v]; });
      const meilleurMois = r.parMois.indexOf(Math.max(...r.parMois));
      return '<div style="padding:12px">' + carteAnnee(an, r.jours) +
        '<div class="grid2" style="margin-top:14px">' + bilan + '</div>' +
        (palmares ? '<div class="note" style="margin:14px 0 5px">Les plus regardées</div>' + palmares : "") +
        (r.eps ? '<p class="note" style="margin-top:11px">Mois le plus chargé : <b style="color:var(--papier)">' +
          MOIS[meilleurMois] + '</b> avec ' + r.parMois[meilleurMois] + ' épisodes.' +
          (record[1] > 1 ? ' Journée record : <b style="color:var(--papier)">' + frDate(record[0]) +
            '</b>, ' + record[1] + ' visionnages.' : "") + '</p>' : "") +
        '</div>';
    })();
    return '<details class="season" data-an="' + an + '"' + (ouvert ? " open" : "") + '>' +
      '<summary><h3>' + an + '</h3>' +
      '<span class="mono" style="font-size:11px;color:var(--gris)">' + esc(resume) + '</span></summary>' +
      dedans + '</details>';
  }).join("") + '</div>' : "";

  return '<div class="eyebrow">Séries</div><div class="grid2">' + cartes + '</div>' + blocFilms + blocAnnee +
    '<div class="eyebrow">Activité sur 12 mois</div><div class="box">' + spark + '</div>' +
    (top ? '<div class="eyebrow">Temps par série</div><div class="box">' + top + '</div>' : "") +
    (genres ? '<div class="eyebrow">Genres</div><div class="chips" style="flex-wrap:wrap">' + genres + '</div>' : "");
}

/* ============================================================
   ENTRETIEN — doublons et vérification
   ============================================================ */
const clefTitre = t => norm(t).replace(/[^a-z0-9]/g, "");

/* Deux fiches distinctes pour la même série : cela arrive quand deux imports
   retrouvent des entrées différentes du catalogue, une version originale et
   un remake, ou un titre traduit. On rapproche sur le titre réduit et sur les
   identifiants externes, jamais sur une simple ressemblance. */
function doublons(){
  const l = Object.values(DB.shows);
  const groupes = new Map();
  const ajouter = (cle, sh) => {
    if(!cle) return;
    if(!groupes.has(cle)) groupes.set(cle, new Set());
    groupes.get(cle).add(sh);
  };
  l.forEach(sh => {
    ajouter("t:" + clefTitre(sh.name), sh);
    if(sh.imdb) ajouter("i:" + sh.imdb, sh);
    if(sh.tvdb) ajouter("d:" + sh.tvdb, sh);
  });
  const vus = new Set(), paires = [];
  groupes.forEach(set => {
    if(set.size < 2) return;
    const arr = [...set].sort((a, b) => avancement(b).watched - avancement(a).watched || (a.addedAt || 0) - (b.addedAt || 0));
    const signature = arr.map(x => x.id).sort().join("-");
    if(vus.has(signature)) return;
    vus.add(signature);
    paires.push(arr);
  });
  return paires;
}
function fusionner(gardeId, perdusIds){
  const garde = DB.shows[gardeId];
  if(!garde) return 0;
  let repris = 0;
  perdusIds.forEach(pid => {
    const perdu = DB.shows[pid];
    if(!perdu || perdu.id === garde.id) return;
    (perdu.eps || []).forEach(e => {
      const v = vues(e);
      if(!v.length) return;
      const cible = (garde.eps || []).find(x => x.s === e.s && x.n === e.n);
      if(cible){
        const fus = [...new Set([...vues(cible), ...v])].sort();
        if(fus.length > vues(cible).length) repris++;
        poser(cible, fus);
      }
      delete DB.watched[e.i]; salirVues(e.i);
    });
    if(perdu.archive) garde.archive = true;
    garde.activite = Math.max(garde.activite || 0, perdu.activite || 0);
    delete DB.shows[pid];
    sale.shows.delete(String(pid));
    sale.suppr.add(String(pid));
  });
  autoStatut(garde); sauverShow(garde);
  return repris;
}

/* Contrôles de cohérence sur l'ensemble de la bibliothèque. */
function verifier(){
  const shows = Object.values(DB.shows);
  const connus = new Set();
  shows.forEach(sh => (sh.eps || []).forEach(e => connus.add(String(e.i))));
  const orphelins = Object.keys(DB.watched).filter(k => !connus.has(String(k)));
  return {
    vides: shows.filter(sh => !(sh.eps || []).length),
    sansAffiche: shows.filter(sh => !sh.poster),
    orphelins,
    orphelinsVues: orphelins.reduce((t, k) => t + (DB.watched[k] || []).length, 0),
    filmsSansDuree: Object.values(DB.films).filter(f => !f.duree),
    doublons: doublons().length
  };
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act === "tab"){
    state.cherche = false;
    if(state.tab !== id){ state.limite = PAGE; state.limiteF = PAGE; state.limiteA = PAGE; state.vise = null; }
    state.tab = id; render(); window.scrollTo(0, 0); return;
  }
  if(act === "changelog"){
    state.cherche = false; state.tab = "reglages"; state.journal = true; state.neuf = false;
    DB.meta.vue = VERSION; sauver(); render();
    setTimeout(() => { const a = $("#anc-journal"); if(a) a.scrollIntoView({ behavior:"smooth", block:"start" }); }, 60);
    return;
  }
  if(act === "rien"){ ev.stopPropagation(); return; }
  if(act === "tirage"){
    state.tirage = { type:state.tab === "films" ? "films" : "series", duree:0, fav:false, id:null };
    tirer(); render(); return;
  }
  if(act === "tir-fermer"){
    if(el.classList.contains("voile") && ev.target !== el) return;
    state.tirage = null; render(); return;
  }
  if(act === "tir-encore"){ tirer(); render(); return; }
  if(act === "tir-duree"){ state.tirage.duree = +id; tirer(); render(); return; }

    state.limite = PAGE; state.detail = null;

/* ---------- défilement horizontal à la souris ----------
   Les rangées de filtres se font glisser au doigt sur mobile ; au pointeur,
   rien ne se passait. On rétablit le glisser-déposer et la molette, en
   neutralisant le clic lorsqu'il s'agissait en fait d'un déplacement. */
(function(){
  let piste = null, depart = 0, base = 0, bouge = false;
  document.addEventListener("pointerdown", ev => {
    bouge = false;   // toujours remis à plat : un glissement avorté ailleurs
                     // laissait le drapeau levé et avalait le clic suivant
    if(ev.pointerType === "touch" || ev.button !== 0) return;
    const c = ev.target.closest(".chips");
    if(!c || c.scrollWidth <= c.clientWidth + 2) return;
    piste = c; depart = ev.clientX; base = c.scrollLeft;
  });
  document.addEventListener("pointermove", ev => {
    if(!piste) return;
    const d = ev.clientX - depart;
    if(!bouge && Math.abs(d) > 4){ bouge = true; piste.classList.add("tire"); }
    if(bouge){ piste.scrollLeft = base - d; ev.preventDefault(); }
  });
  const fin = () => { if(piste) piste.classList.remove("tire"); piste = null; };
  document.addEventListener("pointerup", fin);
  document.addEventListener("pointercancel", fin);
  document.addEventListener("click", ev => {
    if(!bouge) return;
    bouge = false;
    ev.stopPropagation(); ev.preventDefault();
  }, true);
  document.addEventListener("wheel", ev => {
    const c = ev.target.closest(".chips");
    if(!c || c.scrollWidth <= c.clientWidth + 2) return;
    if(Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    c.scrollLeft += ev.deltaY;
    ev.preventDefault();
  }, { passive:false });
})();

/* ============================================================
   SAUVEGARDE VERS GOOGLE DRIVE
   Flux OAuth « jeton » de Google Identity Services : pas de secret côté
   client, pas de jeton de rafraîchissement. L'autorisation dure environ une
   heure, puis se renouvelle sans rien demander tant que la session Google est
   active et le consentement déjà donné.
   Portée drive.file : Antenne ne voit que les fichiers qu'elle a créés.
   ============================================================ */
const GD = { jeton:null, expire:0, client:null, attente:[], enCours:false };
const gdClient = () => ((DB.settings && DB.settings.gid) || CFG.gid || "").trim();
const gidDuSite = () => !!(CFG.gid && !(DB.settings && DB.settings.gid));
const gdConnecte = () => !!(gdClient() && DB.settings.gdFichier);

function chargerGIS(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(GD.chargement) return GD.chargement;
  GD.chargement = new Promise((res, rej) => {
    const b = document.createElement("script");
    b.src = "https://accounts.google.com/gsi/client";
    b.async = true; b.defer = true;
    b.onload = () => res();
    b.onerror = () => rej(new Error("bibliothèque Google injoignable"));
    document.head.appendChild(b);
  });
  return GD.chargement;
}

/* interactif = true ouvre la fenêtre de consentement ; false tente en silence */
async function gdJeton(interactif){
  if(GD.jeton && Date.now() < GD.expire - 60000) return GD.jeton;
  if(!gdClient()) throw new Error("identifiant client absent");
  await chargerGIS();
  return new Promise((res, rej) => {
    if(!GD.client){
      GD.client = google.accounts.oauth2.initTokenClient({
        client_id: gdClient(),
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: r => {
          if(r && r.access_token){
            GD.jeton = r.access_token;
            GD.expire = Date.now() + ((r.expires_in || 3600) * 1000);
            GD.attente.forEach(f => f.res(GD.jeton));
          }else{
            GD.attente.forEach(f => f.rej(new Error("autorisation refusée")));
          }
          GD.attente = [];
        },
        error_callback: e => {
          GD.attente.forEach(f => f.rej(new Error((e && (e.type || e.message)) || "autorisation impossible")));
          GD.attente = [];
        }
      });
    }
    GD.attente.push({ res, rej });
    try{ GD.client.requestAccessToken({ prompt: interactif ? "consent" : "" }); }
    catch(e){ GD.attente = []; rej(e); }
  });
}

async function gdAppel(url, opts, interactif){
  const t = await gdJeton(!!interactif);
  const o = opts || {};
  const r = await fetch(url, { ...o, headers:{ Authorization:"Bearer " + t, ...(o.headers || {}) } });
  if(r.status === 401){ GD.jeton = null; throw new Error("session expirée"); }
  if(!r.ok) throw new Error("Drive " + r.status + " " + (await r.text()).slice(0, 120));
  return r;
}

const GD_FICHIER = "antenne-sauvegarde.json";
const gdNomDossier = () => (DB.settings.gdNom || "Antenne").replace(/['\\]/g, "");

async function gdDossier(interactif){
  if(DB.settings.gdDossier) return DB.settings.gdDossier;

  const r = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=files(id)&q=" + encodeURIComponent(q), null, interactif);
  const d = await r.json();
  let id = d.files && d.files[0] && d.files[0].id;
  if(!id){
    const c = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=id", {
      method:"POST", headers:{ "Content-Type":"application/json" },

async function gdEnvoyer(interactif){
  if(GD.enCours) return null;
  GD.enCours = true;
  try{
    const contenu = contenuSauvegarde();
    if(DB.settings.gdFichier){
      try{
        await gdAppel("https://www.googleapis.com/upload/drive/v3/files/" + DB.settings.gdFichier + "?uploadType=media",
          { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:contenu }, interactif);
        DB.meta.cloud = Date.now(); DB.meta.exporte = Date.now(); sauver();
        return contenu.length;
      }catch(e){
        if(!/Drive 404/.test(e.message)) throw e;
        DB.settings.gdFichier = "";   // effacé côté Drive : on en recrée un
      }
    }
    const dossier = await gdDossier(interactif);
    const lim = "antenne" + Date.now();
    const corps = "--" + lim + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify({ name:GD_FICHIER, parents:[dossier] }) + "\r\n" +
      "--" + lim + "\r\nContent-Type: application/json\r\n\r\n" + contenu + "\r\n--" + lim + "--";
    const r = await gdAppel("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + lim }, body:corps }, interactif);
    DB.settings.gdFichier = (await r.json()).id;
    DB.meta.cloud = Date.now(); DB.meta.exporte = Date.now(); sauver();
    return contenu.length;
  }finally{ GD.enCours = false; }
}

async function gdRecuperer(interactif){
  if(!DB.settings.gdFichier){
    const q = "name='" + GD_FICHIER + "' and trashed=false";
    const r = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=files(id,modifiedTime)&orderBy=modifiedTime desc&q=" +
      encodeURIComponent(q), null, interactif);
    const d = await r.json();
    if(!d.files || !d.files.length) throw new Error("aucune sauvegarde trouvée sur ce compte");

  }
  const r = await gdAppel("https://www.googleapis.com/drive/v3/files/" + DB.settings.gdFichier + "?alt=media", null, interactif);
  return r.json();
}

/* ---------- CSV : lecture ---------- */
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const tete = txt.slice(0, txt.indexOf("\n") > 0 ? txt.indexOf("\n") : 400);
  const sep = [",", ";", "\t"].sort((a, b) => (tete.split(b).length - tete.split(a).length))[0];
  const rows = []; let f = "", row = [], quote = false;
  for(let i = 0; i < txt.length; i++){
    const c = txt[i];
    if(quote){
      if(c === '"'){ if(txt[i+1] === '"'){ f += '"'; i++; } else quote = false; }
      else f += c;
    }else{
      if(c === '"') quote = true;
      else if(c === sep){ row.push(f); f = ""; }
      else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
  }
  if(f.length || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
function colonne(tete, exacts, partiels){
  let i = tete.findIndex(h => exacts.includes(h));
  if(i < 0 && partiels) i = tete.findIndex(h => partiels.some(p => h.includes(p)));
  return i;
}

/* ---------- lecture d'une archive ZIP ----------
   Les exports TV Time arrivent en .zip. Plutôt que de demander une extraction
   manuelle, on lit l'archive directement : en-têtes ZIP à la main, puis
   décompression par DecompressionStream, présent dans tous les navigateurs
   récents.                                                                */
async function lireZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let fin = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ fin = i; break; }
  }
  if(fin < 0) throw new Error("ce fichier n'est pas une archive ZIP lisible");
  const nb = dv.getUint16(fin + 10, true);
  let off = dv.getUint32(fin + 16, true);
  const dec = new TextDecoder();
  const entrees = new Map();
  for(let k = 0; k < nb; k++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const methode = dv.getUint16(off + 10, true);
    const tailleC = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nom = dec.decode(u8.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if(nom.endsWith("/")) continue;
    const lnLen = dv.getUint16(local + 26, true), leLen = dv.getUint16(local + 28, true);
    const debut = local + 30 + lnLen + leLen;
    entrees.set(nom.split("/").pop(), { methode, brut:u8.subarray(debut, debut + tailleC) });
  }
  return entrees;
}
async function extraire(e){
  if(e.methode === 0) return new TextDecoder().decode(e.brut);
  if(e.methode !== 8) throw new Error("compression non gérée");
  if(!window.DecompressionStream) throw new Error("ce navigateur ne sait pas décompresser les ZIP");
  const flux = new Blob([e.brut]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(flux).text();
}

/* ---------- aiguillage ---------- */
const estTVTime = tete => tete.includes("key") && tete.includes("series_name") && tete.includes("s_id");

async function importerFichier(f){
  impr.ouvrir("imp");
  try{
    if(/\.zip$/i.test(f.name)){
      impr.dire("Ouverture de l'archive " + f.name + "…");
      const zip = await lireZip(await f.arrayBuffer());
      impr.dire(zip.size + " fichiers dans l'archive.");
      const choix = ["tracking-prod-records-v2.csv", "tracking-prod-records.csv"]
        .find(n => zip.has(n)) || [...zip.keys()].find(n => /\.csv$/i.test(n));
      if(!choix) throw new Error("aucun CSV dans l'archive");
      impr.dire("Lecture de " + choix + "…");
      return importerCSV(await extraire(zip.get(choix)));
    }
    return importerCSV(await f.text());
  }catch(e){
    impr.dire("Échec : " + (e && e.message || e));
    impr.fermer();
  }
}

async function importerCSV(txt){
  impr.ouvrir("imp");
  const rows = parseCSV(txt);
  if(rows.length < 2){ impr.dire("Fichier vide ou illisible."); return impr.fermer(); }
  const tete = rows[0].map(h => h.toLowerCase().trim().replace(/^"|"$/g, ""));
  impr.dire(rows.length - 1 + " lignes lues.");
  return estTVTime(tete) ? importerTVTime(rows, tete) : importerGenerique(rows, tete);
}

/* ---------- format TV Time (tracking-prod-records-v2) ----------
   Une ligne par visionnage, préfixée watch-episode ou rewatch-episode.
   Les lignes user-series portent le suivi, l'archivage et « pour plus tard ».
   s_id est l'identifiant TVDB : la correspondance est exacte, sans deviner
   à partir du titre.                                                       */
async function importerTVTime(rows, tete){
  const c = k => tete.indexOf(k);
  const iKey = c("key"), iNom = c("series_name"), iSid = c("s_id"),
        iS = c("season_number"), iE = c("episode_number"), iD = c("created_at"),
        iFol = c("is_followed"), iArc = c("is_archived"), iLat = c("is_for_later");

  impr.dire("Format reconnu : export TV Time.");
  const series = new Map();
  const obtenir = (sid, nom) => {
    if(!series.has(sid)) series.set(sid, { sid, nom, suivi:true, archive:false, plusTard:false, vues:new Map() });
    const s = series.get(sid);
    if(nom && !s.nom) s.nom = nom;
    return s;
  };

  rows.slice(1).forEach(r => {
    const key = String(r[iKey] || "");
    const sid = String(r[iSid] || "").trim();
    if(!sid || !/^\d+$/.test(sid)) return;
    const s = obtenir(sid, String(r[iNom] || "").trim());
    if(key.startsWith("user-series")){
      s.suivi    = String(r[iFol]) === "true";
      s.archive  = String(r[iArc]) === "true";
      s.plusTard = String(r[iLat]) === "true";
    }else if(key.startsWith("watch-episode") || key.startsWith("rewatch-episode")){
      const se = parseInt(r[iS], 10), ep = parseInt(r[iE], 10);
      if(isNaN(se) || isNaN(ep)) return;
      const k2 = se + "-" + ep;
      if(!s.vues.has(k2)) s.vues.set(k2, []);
      s.vues.get(k2).push(r[iD] || null);
    }
  });

  const total = series.size;
  const nbVues2 = [...series.values()].reduce((t, s) => t + [...s.vues.values()].reduce((x, v) => x + v.length, 0), 0);
  impr.dire(total + " séries et " + nbVues2 + " visionnages à reprendre.");
  impr.dire("Compte environ " + dureeLongue(Math.ceil(total * 1.1 / 60)) + ". Laisse cet onglet ouvert.\n");

  let ok = 0, coches = 0, revus = 0, arch = 0;
  const rates = [];
  let i = 0;
  for(const s of series.values()){
    if(state.annuler){ impr.dire("\nInterrompu. Les " + ok + " premières séries sont enregistrées."); break; }
    i++;
    impr.avance(i, total, (total - i) * 1.1);
    try{
      let sh = Object.values(DB.shows).find(x => String(x.tvdb) === s.sid);
      if(!sh){
        const lk = await net.get(API + "/lookup/shows?thetvdb=" + s.sid);
        if(lk) sh = await fetchShow(lk.id);
      }
      if(!sh && s.nom){
        const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(s.nom) + "&embed=episodes");
        if(r){ sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); }
      }
      if(!sh){ rates.push(s.nom || s.sid); impr.dire("✗ " + (s.nom || "TVDB " + s.sid)); continue; }

      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      let c2 = 0, r2 = 0;
      s.vues.forEach((dates, k2) => {
        const [se, ep] = k2.split("-").map(Number);
        const e = (cible.eps || []).find(x => x.s === se && x.n === ep);
        if(!e) return;
        const avant = vues(e).length;
        const cur = vues(e).slice();
        while(cur.length < dates.length){
          const d = dates[cur.length];
          const t = d ? new Date(String(d).replace(" ", "T") + "Z") : null;
          cur.push(t && !isNaN(t) ? t.toISOString() : new Date().toISOString());
        }
        if(cur.length > avant){ c2++; r2 += Math.max(0, dates.length - 1); poser(e, cur); }
      });

      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      cible.archive = !!s.archive;
      if(s.archive) arch++;
      if(s.plusTard) cible.userStatus = "planned";
      else if(!s.suivi && !s.vues.size) cible.userStatus = "planned";
      const air = epsOf(cible).filter(diffuse);
      if(air.length) cible.pass = Math.max(1, Math.min.apply(null, air.map(nbVues)));
      autoStatut(cible); sauverShow(cible);

      coches += c2; revus += r2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "") +
        (r2 ? "  +" + r2 + " revisionnages" : "") +
        (cible.pass > 1 ? "  passage " + cible.pass : "") +
        (s.archive ? "  [archivée]" : ""));
    }catch(e){
      rates.push(s.nom || s.sid);
      impr.dire("✗ " + (s.nom || s.sid) + " (" + (e && e.message || e) + ")");
    }
  }
  impr.avance(total, total);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes, " + revus + " revisionnages, " + arch + " archivées." +
    (rates.length ? "\nNon retrouvées (" + rates.length + ") : " + rates.slice(0, 20).join(", ") + (rates.length > 20 ? "…" : "") : ""));
  impr.fermer();
  toast(ok + " séries importées");
  majQuota();
}

/* ============================================================
   BetaSeries — deux fichiers complémentaires
   series-*.csv   : id, title, archive, episode (dernier vu), remaining, status
   episodes-*.csv : id, show, episode (SxxEyy), title, date, note
   Pas d'identifiant TVDB ici : la correspondance se fait sur le titre, avec
   plusieurs tentatives. Pas de revisionnage dans cet export non plus, chaque
   épisode n'y figure qu'une fois.
   ============================================================ */
const estBSseries  = t => t.includes("title") && t.includes("archive") && t.includes("remaining");
const estBSepisode = t => t.includes("show") && t.includes("episode") && t.includes("date");
const estBSfilms   = t => t.includes("title") && t.includes("status") && t.includes("date") &&
                          !t.includes("show") && !t.includes("archive") && !t.includes("episode");
const lireSE = v => {
  const m = /^S(\d+)E(\d+)$/i.exec(String(v || "").trim());
  if(!m) return null;
  const se = { s:+m[1], n:+m[2] };
  return se.s === 0 && se.n === 0 ? null : se;   // S00E00 = rien de vu
};

async function importerBS(fichiers){
  impr.ouvrir("bs");
  try{
    const csvs = [];
    for(const f of fichiers){
      if(/\.zip$/i.test(f.name)){
        impr.dire("Ouverture de " + f.name + "…");
        const zip = await lireZip(await f.arrayBuffer());
        for(const [nom, e] of zip) if(/\.csv$/i.test(nom)) csvs.push({ nom, txt:await extraire(e) });
      }else{
        csvs.push({ nom:f.name, txt:await f.text() });
      }
    }
    let rSeries = null, rEpisodes = null, rFilms = null;
    for(const c of csvs){
      const rows = parseCSV(c.txt);
      if(rows.length < 2) continue;
      const tete = rows[0].map(h => h.toLowerCase().trim());
      if(estBSseries(tete))       { rSeries = { rows, tete };   impr.dire("Séries : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
      else if(estBSepisode(tete)) { rEpisodes = { rows, tete }; impr.dire("Épisodes : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
      else if(estBSfilms(tete))   { rFilms = { rows, tete };    impr.dire("Films : " + c.nom + " (" + (rows.length - 1) + " lignes)"); }
    }
    if(!rSeries && !rEpisodes && !rFilms){
      impr.dire("Aucun fichier BetaSeries reconnu. Attendu : series-*.csv, episodes-*.csv, films-*.csv.");
      return impr.fermer();
    }
    if(rSeries || rEpisodes) await importerBetaSeries(rSeries, rEpisodes, !!rFilms);
    if(rFilms) await importerFilmsBS(rFilms);
    impr.fermer(); majQuota();
  }catch(e){
    impr.dire("Échec : " + (e && e.message || e));
    impr.fermer();
  }
}

/* Correspondance par titre, du plus précis au plus large. */
async function trouverParTitre(titre){
  const nu = titre.replace(/\s*\((19|20)\d{2}\)\s*$/, "").trim();
  for(const t of (nu && nu !== titre ? [titre, nu] : [titre])){
    const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(t) + "&embed=episodes");
    if(r){ const sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); return sh; }
  }
  const res = await net.get(API + "/search/shows?q=" + encodeURIComponent(nu || titre));
  if(res && res.length){
    const cible = norm(nu || titre);
    const m = res.find(x => norm(x.show.name) === cible);
    if(m) return await fetchShow(m.show.id);
  }
  return null;
}

async function importerBetaSeries(rSeries, rEpisodes, encore){
  const series = new Map();   // titre → { titre, archive, dernier }
  const vusPar = new Map();   // titre → Map("s-n" → date)

  if(rSeries){
    const c = k => rSeries.tete.indexOf(k);
    const iT = c("title"), iA = c("archive"), iE = c("episode");
    rSeries.rows.slice(1).forEach(r => {
      const titre = String(r[iT] || "").trim();
      if(!titre) return;
      series.set(titre, { titre, archive:String(r[iA]).trim() === "1", dernier:lireSE(r[iE]) });
    });
  }
  if(rEpisodes){
    const c = k => rEpisodes.tete.indexOf(k);
    const iS = c("show"), iE = c("episode"), iD = c("date");
    rEpisodes.rows.slice(1).forEach(r => {
      const titre = String(r[iS] || "").trim();
      const se = lireSE(r[iE]);
      if(!titre || !se) return;
      if(!series.has(titre)) series.set(titre, { titre, archive:false, dernier:null });
      if(!vusPar.has(titre)) vusPar.set(titre, new Map());
      vusPar.get(titre).set(se.s + "-" + se.n, r[iD] || null);
    });
  }

  const total = series.size;
  const nbEp = [...vusPar.values()].reduce((t, m) => t + m.size, 0);
  impr.dire("\n" + total + " séries et " + nbEp + " épisodes vus à reprendre.");
  impr.dire("Correspondance par titre — compte environ " + dureeLongue(Math.ceil(total * 0.6 / 60)) +
            ". Laisse cet onglet ouvert.\n");

  let ok = 0, coches = 0, arch = 0, deduits = 0;
  const rates = []; let i = 0;
  for(const s of series.values()){
    if(state.annuler){ impr.dire("\nInterrompu. Les " + ok + " premières séries sont enregistrées."); break; }
    i++; impr.avance(i, total, (total - i) * 0.6);
    try{
      let sh = Object.values(DB.shows).find(x => norm(x.name) === norm(s.titre));
      if(!sh) sh = await trouverParTitre(s.titre);
      if(!sh){ rates.push(s.titre); impr.dire("✗ " + s.titre); continue; }

      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      const liste = vusPar.get(s.titre);
      let c2 = 0, mode = "";

      if(liste && liste.size){
        liste.forEach((d, k) => {
          const [se, ep] = k.split("-").map(Number);
          const e = (cible.eps || []).find(x => x.s === se && x.n === ep);
          if(!e || vues(e).length) return;
          const t = d ? new Date(String(d).replace(" ", "T") + "Z") : null;
          poser(e, [t && !isNaN(t) ? t.toISOString() : new Date().toISOString()]);
          c2++;
        });
      }else if(s.dernier){
        // Pas de détail épisode par épisode : on se fie au dernier vu déclaré.
        const eps = epsOf(cible);
        const fin = eps.findIndex(e => e.s === s.dernier.s && e.n === s.dernier.n);
        if(fin >= 0){
          eps.slice(0, fin + 1).filter(diffuse).forEach(e => { if(!vues(e).length){ poser(e, [new Date().toISOString()]); c2++; } });
          mode = " (déduit du dernier épisode vu)";
          deduits++;
        }
      }

      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      cible.archive = !!s.archive;
      if(s.archive) arch++;
      if(!c2 && !avancement(cible).watched) cible.userStatus = "planned";
      autoStatut(cible); sauverShow(cible);
      coches += c2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "  rien de vu") + mode + (s.archive ? "  [archivée]" : ""));
    }catch(e){
      rates.push(s.titre);
      impr.dire("✗ " + s.titre + " (" + (e && e.message || e) + ")");
    }
  }
  impr.avance(total, total);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes, " + arch + " archivées" +
    (deduits ? ", " + deduits + " déduites du dernier épisode" : "") + "." +
    (rates.length ? "\nNon retrouvées (" + rates.length + ") : " + rates.slice(0, 25).join(", ") + (rates.length > 25 ? "…" : "") : ""));
  toast(ok + " séries importées");
  if(!encore){ impr.fermer(); majQuota(); }
}

/* ---------- films BetaSeries ----------
   films-*.csv : id, title, status (1 = vu, 0 = à voir), date.
   L'identifiant est propre à BetaSeries : la correspondance passe par le
   titre, y compris en écriture d'origine (狼图腾, 부산행), que TMDb indexe. */
async function importerFilmsBS(rF){
  const c = k => rF.tete.indexOf(k);
  const iT = c("title"), iS = c("status"), iD = c("date");
  const films = rF.rows.slice(1).map(r => ({
    titre:String(r[iT] || "").trim(),
    vu:String(r[iS]).trim() === "1",
    date:r[iD] || null
  })).filter(x => x.titre);
  if(!films.length) return;

  if(!cleTMDB()){
    impr.dire("\n" + films.length + " films repérés, mais aucune clé TMDb n'est renseignée.");
    impr.dire("Ajoute la clé dans les Réglages, puis relance cet import : les séries déjà reprises ne seront pas dupliquées.");
    return;
  }

  impr.dire("\n" + films.length + " films à reprendre.");
  let ok = 0, vus = 0; const rates = []; let i = 0;
  for(const f of films){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    i++; impr.avance(i, films.length, (films.length - i) * 0.5);
    try{
      const res = await chercherFilms(f.titre);
      const m = res.find(x => norm(x.titre) === norm(f.titre)) || res[0];
      if(!m){ rates.push(f.titre); impr.dire("✗ " + f.titre); continue; }
      const plein = await completerFilm(m);
      const fi = ajouterFilm(plein, f.vu ? "watched" : "planned");
      if(f.vu && !nbVuesFilm(fi)){
        const d = f.date && !isNaN(new Date(f.date)) ? new Date(f.date).toISOString() : new Date().toISOString();
        fi.vu = [d]; fi.statut = "watched"; sauverFilm(fi);
        vus++;
      }
      ok++;
      impr.dire("✓ " + fi.titre + (fi.annee ? " (" + fi.annee + ")" : "") +
        (f.vu ? "  vu" + (f.date ? " le " + f.date : "") : "  à voir") +
        (norm(fi.titre) !== norm(f.titre) ? "   ← " + f.titre : ""));
      await sleep(150);
    }catch(e){
      rates.push(f.titre);
      impr.dire("✗ " + f.titre + " (" + (e && e.message || e) + ")");
    }
  }
  impr.dire("\nFilms : " + ok + " repris, dont " + vus + " déjà vus." +
    (rates.length ? "\nNon trouvés (" + rates.length + ") : " + rates.join(", ") : ""));
  toast(ok + " films importés");
}

/* ---------- CSV d'origine quelconque ---------- */
async function importerGenerique(rows, tete){
  const cN = colonne(tete, ["show_name","series_name","serie","série","show","series","title","name","tv_show","show name"], ["show","serie","title"]);
  const cS = colonne(tete, ["season_number","season","saison","season_no","s"], ["season","saison"]);
  const cE = colonne(tete, ["episode_number","episode","épisode","number","episode_no","e"], ["episode","épisode","number"]);
  const cT = colonne(tete, ["tvdb_id","thetvdb_id","tvdb","series_id","show_id","s_id"], ["tvdb"]);
  const cD = colonne(tete, ["watched_at","created_at","date_watched","last_watched","updated_at","date","timestamp"], ["watched","date"]);

  impr.dire("Colonnes détectées : " + ([cN >= 0 ? "série=" + tete[cN] : null, cS >= 0 ? "saison=" + tete[cS] : null,
       cE >= 0 ? "épisode=" + tete[cE] : null, cT >= 0 ? "tvdb=" + tete[cT] : null].filter(Boolean).join("  ") || "aucune"));
  if(cN < 0 && cT < 0){ impr.dire("Impossible de repérer la série : il faut une colonne de titre ou d'identifiant TVDB."); return impr.fermer(); }
  if(cS < 0 || cE < 0) impr.dire("Pas de colonne saison/épisode : les séries seront ajoutées sans cocher d'épisode.");

  const groupes = new Map();
  rows.slice(1).forEach(r => {
    const nom = cN >= 0 ? String(r[cN] || "").trim() : "";
    const tv  = cT >= 0 ? String(r[cT] || "").trim() : "";
    const cle = nom || (tv ? "tvdb:" + tv : "");
    if(!cle) return;
    if(!groupes.has(cle)) groupes.set(cle, { nom, tvdb:/^\d+$/.test(tv) ? tv : null, eps:[] });
    if(cS >= 0 && cE >= 0){
      const s2 = parseInt(r[cS], 10), n2 = parseInt(r[cE], 10);
      if(!isNaN(s2) && !isNaN(n2)) groupes.get(cle).eps.push({ s:s2, n:n2, d: cD >= 0 ? r[cD] : null });
    }
  });

  impr.dire(groupes.size + " séries repérées.");
  let ok = 0, coches = 0; const rates = []; let i = 0;
  for(const [cle, g] of groupes){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    i++; impr.avance(i, groupes.size, (groupes.size - i) * 1.1);
    const etiquette = g.nom || cle;
    try{
      let sh = Object.values(DB.shows).find(x => x.name.toLowerCase() === etiquette.toLowerCase() || (g.tvdb && String(x.tvdb) === g.tvdb));
      if(!sh && g.tvdb){
        const lk = await net.get(API + "/lookup/shows?thetvdb=" + g.tvdb);
        if(lk) sh = await fetchShow(lk.id);
      }
      if(!sh && g.nom){
        const r = await net.get(API + "/singlesearch/shows?q=" + encodeURIComponent(g.nom) + "&embed=episodes");
        if(r){ sh = normShow(r); sh.eps = normEps(r._embedded && r._embedded.episodes); }
      }
      if(!sh){ rates.push(etiquette); impr.dire("✗ " + etiquette); continue; }
      if(!DB.shows[sh.id]) ajouterShow(sh, "watching");
      const cible = DB.shows[sh.id];
      let c2 = 0, rw = 0;
      const paquet = new Map();
      g.eps.forEach(x => { const k = x.s + "-" + x.n; if(!paquet.has(k)) paquet.set(k, []); paquet.get(k).push(x.d); });
      paquet.forEach((dates, k) => {
        const [s2, n2] = k.split("-").map(Number);
        const e = (cible.eps || []).find(x => x.s === s2 && x.n === n2);
        if(!e) return;
        const avant = vues(e).length;
        const cur = vues(e).slice();
        while(cur.length < dates.length){
          const d = dates[cur.length];
          cur.push(d && !isNaN(new Date(d)) ? new Date(d).toISOString() : new Date().toISOString());
        }
        if(cur.length > avant){ c2++; rw += Math.max(0, dates.length - 1); poser(e, cur); }
      });
      const air = epsOf(cible).filter(diffuse);
      if(air.length) cible.pass = Math.max(1, Math.min.apply(null, air.map(nbVues)));
      cible.activite = dernierVu(cible) || cible.addedAt || Date.now();
      autoStatut(cible); sauverShow(cible);
      coches += c2; ok++;
      impr.dire("✓ " + cible.name + (c2 ? "  " + c2 + " épisodes" : "") + (rw ? "  +" + rw + " revisionnages" : ""));
    }catch(e){ rates.push(etiquette); impr.dire("✗ " + etiquette + " (" + (e && e.message || e) + ")"); }
  }
  impr.avance(groupes.size, groupes.size);
  impr.dire("\nTerminé : " + ok + " séries, " + coches + " épisodes." + (rates.length ? " " + rates.length + " non trouvées." : ""));
  impr.fermer();
  toast(ok + " séries importées");
  majQuota();
}

  const bar = $("#imp-bar"), log = $("#imp-log");
  bar.classList.remove("hide"); log.classList.remove("hide"); log.textContent = "";
  for(let i = 0; i < l.length; i++){
    bar.firstElementChild.style.width = Math.round((i + 1) / l.length * 100) + "%";
    try{
      const sh = await fetchShow(l[i].id);
      if(sh) ajouterShow(sh, l[i].userStatus);
      log.textContent += "✓ " + l[i].name + "\n";
    }catch(e){ log.textContent += "✗ " + l[i].name + "\n"; }
    log.scrollTop = log.scrollHeight;
  }
  sauver(); toast("Séries actualisées");
}

/* ---------- fichiers ---------- */
document.addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  if(ev.target.id === "f-json"){
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d.shows) throw new Error("format inattendu");
        if((d.schema || 1) > SCHEMA){
          if(!confirm("Cette sauvegarde vient d'une version plus récente d'Antenne (schéma " + d.schema +
            ", cette page gère le " + SCHEMA + "). Des données peuvent être ignorées. Continuer ?")) return;
        }
        const b = fusionnerSauvegarde(d);
        toast(b.ns + " séries, " + b.nf + " films et " + b.ne + " visionnages ajoutés" + (d.appVersion ? " (sauvegarde v" + d.appVersion + ")" : ""));
      }catch(e){ toast("Fichier illisible : " + e.message); }
    };
    rd.readAsText(f);
  }
  if(ev.target.id === "f-csv"){ importerFichier(f); ev.target.value = ""; return; }
  if(ev.target.id === "f-bs"){ importerBS([...ev.target.files]); ev.target.value = ""; return; }
  ev.target.value = "";
});

/* ---------- mise à jour du catalogue ----------
   TVmaze publie la date de dernière modification de tout son catalogue en un
   seul appel. On la compare à celle de nos fiches et on ne retélécharge que
   ce qui a réellement bougé, au lieu de tourner en rond sur la bibliothèque. */
async function sériesModifiées(depuis){
  const l = Object.values(DB.shows).filter(sh => !sh.archive && sh.userStatus !== "dropped");
  if(!l.length) return { l:[], aFaire:[] };
  const upd = await net.get(API + "/updates/shows?since=" + (depuis || "week"));
  if(!upd) return { l, aFaire:null };
  const aFaire = l
    .filter(sh => upd[sh.id] && upd[sh.id] * 1000 > (sh.lastFetched || 0))
    .sort((a, b) => upd[b.id] - upd[a.id]);
  return { l, aFaire };
}

async function majAuto(){
  try{
    const { aFaire } = await sériesModifiées("week");
    if(!aFaire || !aFaire.length) return;
    const lot = aFaire.slice(0, 25);
    for(const s of lot){
      try{ const sh = await fetchShow(s.id); if(sh) ajouterShow(sh, s.userStatus); }catch(e){}
    }
    sauver();
    if(!state.detail && !state.detailF && !state.cherche) render();
  }catch(e){}
}

/* Version manuelle : fenêtre plus large, journal, et pas de plafond. */
async function actualiserMaj(){
  impr.ouvrir("maj");
  impr.dire("Lecture des modifications du catalogue…");
  let res;
  try{ res = await sériesModifiées("month"); }
  catch(e){ impr.dire("Catalogue injoignable : " + (e && e.message || e)); return impr.fermer(); }
  if(!res.l.length){ impr.dire("Aucune série active à vérifier."); return impr.fermer(); }
  if(!res.aFaire){
    impr.dire("Le catalogue n'a pas répondu. Réessaie plus tard, ou force une réactualisation complète.");
    return impr.fermer();
  }
  impr.dire(res.l.length + " séries suivies, " + res.aFaire.length + " modifiées depuis un mois.");
  if(!res.aFaire.length){
    impr.dire("Tout est déjà à jour — rien à retélécharger.");
    return impr.fermer();
  }
  let ok = 0;
  for(let i = 0; i < res.aFaire.length; i++){
    if(state.annuler){ impr.dire("\nInterrompu."); break; }
    impr.avance(i + 1, res.aFaire.length, (res.aFaire.length - i) * 0.55);
    const s = res.aFaire[i];
    try{
      const sh = await fetchShow(s.id);
      if(sh){ ajouterShow(sh, s.userStatus); ok++; impr.dire("✓ " + sh.name); }
      else impr.dire("✗ " + s.name);
    }catch(e){ impr.dire("✗ " + s.name); }
  }
  impr.avance(res.aFaire.length, res.aFaire.length);
  impr.dire("\n" + ok + " séries actualisées sur " + res.l.length + " suivies.");
  impr.fermer(); render(); toast(ok + " séries actualisées");
}

/* ---------- démarrage ---------- */
function echec(msg, detail){
  $("#view").innerHTML = '<div class="empty" style="padding-top:60px"><h3>' + esc(msg) + '</h3>' +
    '<p>' + esc(detail || "") + '</p>' +
    '<button class="btn" onclick="location.reload()">Recharger la page</button></div>';
}

async function demarrer(){
  $("#view").innerHTML = '<div class="empty" style="padding-top:70px"><p>Ouverture de la bibliothèque…</p></div>';
  try{ await IDB.ouvrir(); }
  catch(e){
    echec("Stockage inaccessible",
      "Ce navigateur refuse d'ouvrir la base locale. C'est le cas en navigation privée sur certains navigateurs, ou si un autre onglet d'Antenne est en cours de mise à jour.");
    return;
  }
  try{
    let k = await IDB.tout();
    let repris = 0;
    // Reprise unique de l'ancien stockage localStorage, qui n'est pas effacé.
    if(!(k.kv.meta && k.kv.meta.repris) && !k.shows.length && localStorage.getItem(LS)){
      repris = await reprendreLocalStorage();
      k = await IDB.tout();
    }
    DB = assembler(k);
    pret = true;
    if(DB.settings.theme){ localStorage.setItem(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
    if(DB.settings.tri) state.tri = DB.settings.tri;
    if(DB.settings.filtre) state.filtre = DB.settings.filtre;
    if(repris) setTimeout(() => toast(repris + " séries reprises depuis l'ancien stockage"), 800);
  }catch(e){
    echec("Lecture impossible", String(e && e.message || e));
    return;
  }

  // Nouvelle installation : rien à signaler. Données existantes : on signale la mise à jour.
  if(DB.meta.vue !== VERSION){
    if(!Object.keys(DB.shows).length && !DB.meta.vue){ DB.meta.vue = VERSION; sauver(); }
    else{
      state.neuf = true;
      setTimeout(() => toast("Antenne est passée en v" + VERSION + " — voir les nouveautés"), 1500);
    }
  }

  render();
  majQuota();
  setTimeout(majAuto, 2500);
  setTimeout(() => gdAuto("lancement"), 4000);
}

// Les comptes à rebours vieillissent : on redessine une fois par minute,
// et seulement là où ils s'affichent, onglet au premier plan.
setInterval(() => {
  if(!pret || document.visibilityState !== "visible") return;
  if(state.cherche || state.tirage || state.detailF) return;
  if(state.tab === "agenda" || state.detail) render();
}, 60000);

// Écriture immédiate quand l'onglet passe en arrière-plan ou se ferme.
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "hidden") return;
  ecouler();
  gdAuto("sortie");
});
window.addEventListener("pagehide", ecouler);

demarrer();
</script>
